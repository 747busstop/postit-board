<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>온라인 포스트잇 게시판</title>
  <style>
    /* 라인1 전용 폰트 */
    @font-face {
      font-family: 'April16Promise';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2404-2@1.0/April16th-Promise.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }

    :root{
      --bg:#0f1115; --text:#e8eaed; --title-color:#ffffff; --title-align:center;
      --postit-image:none; --board-image:none; --note-size: 280px; --panel-width: 320px;
      --cam-x: 0px; --cam-y: 0px; --scale: 1; --topbar-h: 56px;
      --title-font-px: 18px;
      --title-font-family: inherit;
      --title-line1-color: unset;
      --title-line2-color: unset;
    }
    *{ box-sizing:border-box; }
    html,body{
      margin:0; height:100%; min-height:100dvh;
      background:var(--bg); color:var(--text);
      font-family:"Noto Sans KR",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      overscroll-behavior: none;
    }
    button{ cursor:pointer; }
    .app{ display:grid; grid-template-rows:auto auto 1fr; height:100%; }
    .main{ position:relative; height:100%; min-height:0; overflow:hidden; }

    .topbar{
      position:relative; display:grid; grid-template-columns:auto 1fr auto;
      align-items:center; gap:8px; padding:10px 12px;
      border-bottom:1px solid #20242b; background:#0b0e13ee; backdrop-filter: blur(6px);
    }

    .title{ text-align:var(--title-align); color:var(--title-color); font-weight:700; letter-spacing:.2px; overflow:hidden; }
    .title .line1, .title .line2, .title .lineCombined{
      font-size: var(--title-font-px);
      line-height:1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .title .line1{ color: var(--title-line1-color, inherit); font-family: 'April16Promise', var(--title-font-family); }
    .title .line2{ color: var(--title-line2-color, inherit); font-family: var(--title-font-family); margin-top:2px; font-weight:600; opacity:.95; }
    .title .lineCombined .p1{ color: var(--title-line1-color, inherit); font-weight:700; font-family: 'April16Promise', var(--title-font-family); }
    .title .lineCombined .p2{ color: var(--title-line2-color, inherit); font-weight:600; opacity:.95; font-family: var(--title-font-family); }

    .iconbtn, .btn{ background:#1a1f27; border:1px solid #252b35; color:#d9e3f0; padding:8px 12px; border-radius:10px; min-width:44px; min-height:36px; }
    .right-actions{ display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
    .btn.primary{ background:#2563eb; border-color:#2563eb; color:#fff; }

    .toolbar{
      display:flex; align-items:center; gap:12px; padding:8px 12px;
      border-bottom:1px solid #20242b; background:#0b0e13ee; backdrop-filter: blur(4px); z-index:60;
    }
    .toolbar .zoomwrap{ flex:1; display:flex; justify-content:center; }
    .toolbar .group{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .toolbar input[type="range"]{ width: 180px; }
    @media (max-width: 420px){ .toolbar input[type="range"]{ width:120px; } }

    .panel{
      position:fixed; top:var(--topbar-h); bottom:0; width:var(--panel-width);
      background:#0b0e13f2; border-right:1px solid #1f2430;
      transform: translateX(calc(var(--panel-x, -100%)));
      transition: transform .25s ease; overflow:auto; padding:12px; left:0; z-index:1000;
    }
    .panel.right{ left:auto; right:0; border-right:none; border-left:1px solid #1f2430; transform: translateX(calc(var(--panel-x, 100%))); }
    .panel.open{ --panel-x: 0%; }
    .panel h3{ margin:6px 0 8px; font-size:14px; color:#b7c2cf; }

    .table{ width:100%; border-collapse:collapse; font-size:13px; table-layout:auto; }
    .table th, .table td{ border-bottom:1px solid #273040; padding:8px; text-align:left; vertical-align:top; }
    .table th{ color:#b7c2cf; font-weight:600; position:sticky; top:0; background:#0b0e13f2; }
    .table tr{ cursor:pointer; }
    .wrap{ display:block; white-space:normal; overflow-wrap:anywhere; word-break:break-word; }

    .btns{ display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
    .table .btn{ padding:6px 8px; min-width:36px; min-height:30px; }
    .sep{ opacity:.6; }

    .board{
      position:absolute; inset:0; background-image: var(--board-image);
      background-position:center; background-size:cover; background-repeat:no-repeat;
      cursor: default; touch-action: none; will-change: transform;
    }
    .board.panning{ cursor: grabbing; cursor: -webkit-grabbing; }

    .world{
      position:absolute; left:0; top:0;
      transform: translate(var(--cam-x), var(--cam-y)) scale(var(--scale));
      transform-origin: 0 0; width:30000px; height:30000px; will-change: transform;
    }

    .note{
      position:absolute; width:var(--note-size); height:var(--note-size);
      background-image: var(--postit-image); background-size: cover; background-position:center; background-repeat:no-repeat;
      border:none; padding:12px; color:#0b0f14; box-shadow: 0 8px 24px rgba(0,0,0,.28);
      display:flex; flex-direction:column; z-index:1;
    }
    .note .nick{ font-weight:700; color:#111; margin-top:6px; }
    .note .body{ margin-top:6px; color:#111; line-height:1.25; overflow:auto; white-space:pre-wrap; word-break:break-word; }

    .note.draft{ outline: 3px dashed #ff8c00; outline-offset: 0; z-index:9999 !important; }

    .nickInput{ background:transparent; border:none; outline:none; color:#111; font-weight:700; font-size:14px; padding:4px 6px; margin:8px 0 6px; }
    .nickInput::placeholder{ color:#00000066; }
    .textInput{ flex:1; background:transparent; border:none; outline:none; color:#111; resize:none; padding:6px; line-height:1.3; white-space:pre-wrap; }
    .textInput::placeholder{ color:#00000066; }

    .dragHandle{
      position:absolute; left:50%; top:-32px; transform:translateX(-50%);
      background:#ffffffcc; color:#111; border:2px dotted #111; border-radius:10px;
      padding:4px 10px; font-size:14px; user-select:none; cursor:grab; box-shadow: 0 4px 10px rgba(0,0,0,.12);
      display:flex; align-items:center; justify-content:center; gap:6px;
    }
    .dragHandle:active{ cursor:grabbing; }

    .ctrlBar{ position:absolute; left:0; right:0; bottom:-52px; display:flex; gap:8px; justify-content:center; }
    .ctrlBar button{ padding:8px 12px; border-radius:10px; border:2px dotted #111; background:#fff; color:#111; min-width:56px; font-weight:700; }
    .ctrlBar button.del{ background:#ffdfe0; }
    .ctrlBar button:disabled{ opacity:.6; cursor:not-allowed; }

    .fsDial{
      position:absolute; right:-72px; left:auto; top:50%; transform:translateY(-50%);
      background:#ffffffcc; border:2px dotted #111; border-radius:12px; padding:6px; box-shadow: 0 4px 10px rgba(0,0,0,.12);
    }
    .fsDial input[type="range"]{ writing-mode: vertical-lr; direction: rtl; appearance: none; width: 28px; height: 140px; background:transparent; }
    .fsVal{ color:#111; font-size:12px; text-align:center; margin-top:4px; }

    .minimap{
      position:absolute; right:12px; bottom:12px; width:160px; height:160px;
      background:#0b0e13cc; border:1px solid #293241; border-radius:12px; overflow:hidden; z-index:45;
      box-shadow:0 6px 16px rgba(0,0,0,.25);
    }
    .minimap canvas{ width:100%; height:100%; display:block; }

    /* ===== Info Overlay ===== */

  .overlay{
    position:fixed; inset:0; z-index:2000; display:none;
    background:#0b0e13f5; border-left:1px solid #1f2430; border-right:1px solid #1f2430;
  }
  .overlay.open{ display:block; }
  .overlay .close{
    position:absolute; left:50%; transform:translateX(-50%);
    top:10px; right:auto;
    background:#1a1f27; border:1px solid #252b35; color:#fff; border-radius:999px;
    padding:10px 14px; min-width:44px; min-height:36px; line-height:1; font-weight:700;
    z-index: 3000;
  }
  .overlay h2{ margin:8px 0 12px; font-size:18px; }

  /* ✅ 가운데 정렬 핵심: inner를 flex 컨테이너로 만들고, .card에 auto margin */
  .overlay .inner{
    position:absolute; left:0; right:0; bottom:0; top:56px;
    overflow:auto; padding:0 20px 28px;
    z-index: 0;

    /* ▼ 추가된 부분 */
    display: flex;
    flex-direction: column;
    align-items: center; /* 자식 요소(카드)들을 수평 중앙 정렬 */
  }

  .kv{ display:grid; grid-template-columns:120px 1fr; gap:8px 12px; max-width:800px; margin-bottom:18px; }

  .card{
    background:#0f141c; border:1px solid #1f2430; border-radius:12px; padding:12px;

    /* ▼ 변경된 부분: 가운데 정렬 & 반응형 폭 */
    width: 100%;
    max-width: 880px;
    margin: 0 auto 16px; /* 좌우 auto로 중앙 정렬, 아래간격 16px */
  }

  .card h3{ margin:0 0 8px; font-size:15px; color:#b7c2cf; }
  .card h3 a{ color:#7aa2ff; text-decoration:underline; }

  .mono{ font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; }
  .tips li{ margin:6px 0; }
  .md p{ margin: 8px 0; }
  .md ul{ margin: 8px 0 8px 1.2rem; padding: 0; }
  .md li{ margin: 4px 0; }
  .md code{ background:#0b0e13; border:1px solid #1f2430; padding:1px 4px; border-radius:6px; font-family:ui-monospace,Menlo,Consolas,monospace; }
  .md a{ color:#7aa2ff; text-decoration:underline; }
</style>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
</head>
<body>
  <div class="app">
    <div class="topbar" id="topbar">
      <button id="btnPanel" class="iconbtn" title="리스트" aria-label="리스트">🗂️</button>
      <div class="title" id="title"><!-- JS에서 채움 --></div>
      <div class="right-actions">
        <button id="btnNew" class="btn primary" title="새 메모" aria-label="새 메모">＋</button>
        <button id="btnGo"  class="btn" style="display:none;" title="작성중으로 이동" aria-label="작성중으로 이동">🧭</button>
        <button id="btnDel" class="btn" style="display:none;background:#f87171;border-color:#f87171;" title="작성중 삭제" aria-label="작성중 삭제">🗑️</button>
      </div>
    </div>

    <div class="toolbar" id="toolbar">
      <div class="zoomwrap">
        <div class="group">
          <button id="zoomOutTop" class="btn" title="축소" aria-label="축소">−</button>
          <input id="zoomRangeTop" type="range" min="0.2" max="2.0" step="0.01" value="1" aria-label="확대/축소 슬라이더" />
          <button id="zoomInTop" class="btn" title="확대" aria-label="확대">＋</button>
          <button id="capBoardTop" class="btn" title="보드 캡처" aria-label="보드 캡처">📷</button>
          <button id="infoTop" class="btn" title="안내/도움말" aria-label="안내/도움말">ℹ️</button>
        </div>
      </div>
    </div>

    <div class="main" id="main">
      <div class="board" id="board">
        <div class="world" id="world"></div>
      </div>

      <!-- Minimap -->
      <div class="minimap" id="miniWrap"><canvas id="minimap"></canvas></div>

      <!-- Info 오버레이 -->
      <div class="overlay" id="infoOverlay" aria-hidden="true" role="dialog" aria-label="안내">
        <button class="close" id="infoClose" data-action="close-overlay" aria-label="닫기">✕</button>
        <div class="inner" id="infoBody"><!-- JS Render --></div>
      </div>
    </div>
  </div>

  <aside id="panel" class="panel">
    <h3>승인된 메모</h3>
    <table class="table">
      <thead>
        <tr><th class="name">닉네임</th><th class="text">내용</th><th class="act">작업</th></tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </aside>

  <script>
    /* ==========================================================
     * GitHub 설정: 제목(기본/라인2) 전용 폰트
     * ========================================================== */
    const GITHUB_SETTINGS = {
      titleFont: {
        enabled: true,
        name: 'April16thLife',
        url: 'https://cdn.jsdelivr.net/gh/projectnoonnu/2404-2@1.0/April16th-Life.woff2',
        weight: '400'
      }
    };

    /* ====== Config ====== */
    const API = 'https://script.google.com/macros/s/AKfycbxeOSa1aNwnz1FLHWD1bFLpFzJF5bcnPJyKK6QjwHpjZFawZOP9bG5FOMkpq2vjZdtExA/exec'; // Apps Script /exec URL
    const NOTE = { W: 280, H: 280 };
    const WORLD = { W: 30000, H: 30000 };
    const BOUNDS = { W: 10000, H: 10000 };
    const CAMERA = { x: 0, y: 0, scale: 1, min: .2, max: 2 };

    // 제목 한 줄 전환 임계값(px)
    const TITLE_ONE_LINE_BREAKPOINT = 1200;

    /* ====== State / Elements ====== */
    const state = {
      owner: getOrSetOwner_(), settings: null, notes: [], draft: loadDraft_(),
      panelOpen: false, panelDock: 'left', panPrev: null,
      zMap: {}, zCounters: { submitted:0, approved:0 }, lastTapTime: 0, lastTapPos: {x:0,y:0},
      titleParts: { l1:'', l2:'' }, titleOneLine: false
    };

    const $root = document.documentElement;
    const $title = document.getElementById('title');
    const $panel = document.getElementById('panel');
    const $topbar = document.getElementById('topbar');
    const $listBody  = document.getElementById('list');
    const $world = document.getElementById('world');
    const $board = document.getElementById('board');
    const $miniWrap = document.getElementById('miniWrap');
    const $minimap = document.getElementById('minimap');

    const $zoomRangeTop = document.getElementById('zoomRangeTop');
    const $btnNew = document.getElementById('btnNew');
    const $btnGo  = document.getElementById('btnGo');
    const $btnDel = document.getElementById('btnDel');
    const $btnInfoTop = document.getElementById('infoTop');
    const $infoOverlay = document.getElementById('infoOverlay');
    const $infoClose = document.getElementById('infoClose');
    const $infoBody = document.getElementById('infoBody');

    const inertia = { raf:0, vx:0, vy:0, damping:0.985 };
    const pan = { raf:0, dx:0, dy:0, lastVX:0, lastVY:0, lastT:0 };
    function stopInertia(){ if (inertia.raf){ cancelAnimationFrame(inertia.raf); inertia.raf=0; } inertia.vx=0; inertia.vy=0; }

    /* ====== Boot ====== */
    (async function init(){
      applyGithubTitleFont_();
      recalcTopbarHeight_();
      await bootstrap();
      bindUI();
      renderAll();
      evaluateTitleLayout();
      fitTitle();
      focusWorldPoint({ x: 5000, y: 5000 });
      updateTopbarActions();
      window.addEventListener('resize', onResize);

      if (window.ResizeObserver){
        const ro = new ResizeObserver(()=>{
          evaluateTitleLayout();
          fitTitle();
          recalcTopbarHeight_();
        });
        ro.observe($title);
      }

      /* ⬇️ 첫 접속 시 Info 자동 오픈 */
      renderInfoOverlay();
      openInfo();
    })();

    /* === (라인2/기본) 폰트 적용 === */
    function applyGithubTitleFont_(){
      const cfg = GITHUB_SETTINGS && GITHUB_SETTINGS.titleFont;
      if (!cfg || !cfg.enabled || !cfg.name || !cfg.url) return;

      const style = document.createElement('style');
      style.textContent = `
        @font-face{
          font-family: '${cssEscape_(cfg.name)}';
          src: url('${cssEscape_(cfg.url)}') format('woff2');
          font-weight: ${cfg.weight ? cssEscape_(cfg.weight) : '400'};
          font-style: normal;
          font-display: swap;
        }
      `;
      document.head.appendChild(style);
      setVar('--title-font-family', `'${cfg.name}'`);

      if (document.fonts && document.fonts.load){
        const w = parseInt(cfg.weight, 10) || 400;
        document.fonts.load(`${w} 18px '${cfg.name}'`).then(()=>{
          evaluateTitleLayout();
          fitTitle();
          recalcTopbarHeight_();
        }).catch(()=>{});
      }
    }

    function cssEscape_(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

    function onResize(){
      evaluateTitleLayout();
      fitTitle();
      recalcTopbarHeight_();
      updateMinimap();
      stopInertia();
    }

    function recalcTopbarHeight_(){
      const h = $topbar.getBoundingClientRect().height + document.getElementById('toolbar').getBoundingClientRect().height;
      $root.style.setProperty('--topbar-h', h + 'px');
    }

    async function bootstrap(){
      const url = `${API}?action=bootstrap&owner=${encodeURIComponent(state.owner)}`;
      const j = await (await fetch(url, {mode:'cors'})).json();
      if (!j.ok) throw new Error('bootstrap failed');

      const s = j.settings.values;
      state.settings = j.settings;

      // 제목
      const line1 = toStr(s.screenTitleLine1 || s.screenTitle || '온라인 포스트잇 게시판');
      const line2 = toStr(s.screenTitleLine2 || '');
      state.titleParts = { l1: line1, l2: line2 };
      renderTitleDOM();

      document.title = toStr(s.pageTitle || line1);
      setVar('--title-align', s.titleAlign || 'center');
      setVar('--bg', s.bgColor || '#0f1115');

      if (s.screenTitleLine1Color) setVar('--title-line1-color', s.screenTitleLine1Color);
      if (s.screenTitleLine2Color) setVar('--title-line2-color', s.screenTitleLine2Color);

      const ns = parseInt(s.noteSizePx || '280', 10);
      NOTE.W = NOTE.H = ns; setVar('--note-size', ns+'px');

      CAMERA.min = parseFloat(s.zoomMin || '0.2') || .2;
      CAMERA.max = parseFloat(s.zoomMax || '2.0') || 2;
      CAMERA.scale = parseFloat(s.zoomDefault || '1.0') || 1;

      $zoomRangeTop.min = CAMERA.min; $zoomRangeTop.max = CAMERA.max; $zoomRangeTop.value = CAMERA.scale;

      if (j.settings.assets && j.settings.assets.bg) setVar('--board-image', `url(${j.settings.assets.bg})`);
      if (j.settings.assets && j.settings.assets.postit) setVar('--postit-image', `url(${j.settings.assets.postit})`);

      const dock = (s.panelDock || 'left');
      state.panelDock = dock;
      $panel.classList.toggle('right', dock === 'right');

      setVar('--panel-width', (parseInt(s.panelWidthPx||'320',10)||320) + 'px');

      state.notes = (j.data || []).map(sanitizeNote);

      if (state.draft) saveDraft_(Object.assign({}, state.draft));

      updateCamera(0, 0, CAMERA.scale);
      updateMinimap();

      evaluateTitleLayout();
      fitTitle();
      recalcTopbarHeight_();
    }

    /* ====== 제목 DOM & 레이아웃 ====== */
    function renderTitleDOM(){
      const { l1, l2 } = state.titleParts;
      if (state.titleOneLine && l2){
        $title.innerHTML = `
          <div class="lineCombined">
            <span class="p1">${escapeHtml(l1)}</span>
            <span class="p2"> ${escapeHtml(l2)}</span>
          </div>
        `;
      } else {
        $title.innerHTML = `
          <div class="line1">${escapeHtml(l1)}</div>
          ${l2 ? `<div class="line2">${escapeHtml(l2)}</div>` : ''}
        `;
      }
    }

    function evaluateTitleLayout(){
      const vw = Math.max(document.documentElement.clientWidth, window.innerWidth || 0);
      const wantOne = (vw >= TITLE_ONE_LINE_BREAKPOINT) && !!state.titleParts.l2.trim();
      if (wantOne !== state.titleOneLine){
        state.titleOneLine = wantOne;
        renderTitleDOM();
      }
    }

    /* ====== UI 바인딩 ====== */
    function bindUI(){
      document.getElementById('btnPanel').onclick = togglePanel;

      document.getElementById('zoomInTop').onclick  = () => setZoomAtCenter(CAMERA.scale * 1.1);
      document.getElementById('zoomOutTop').onclick = () => setZoomAtCenter(CAMERA.scale / 1.1);
      $zoomRangeTop.oninput = e => setZoomAtCenter(parseFloat(e.target.value));
      document.getElementById('capBoardTop').onclick = () => captureElem($board, 'board.png');

      $btnNew.onclick = () => {
        if (state.draft) { centerOnDraft(1.0); return; }
        const wc = worldCenter();
        createDraftAt({x: wc.x - NOTE.W/2, y: wc.y - NOTE.H/2}, true);
      };
      $btnDel.onclick = clearDraft;
      $btnGo.onclick  = () => centerOnDraft(1.0);

      // Info 버튼
      $btnInfoTop.onclick = () => { renderInfoOverlay(); openInfo(); };
      const closeNow = (e)=>{ e.preventDefault(); e.stopPropagation(); closeInfo(); };
      ['pointerdown','touchstart','click'].forEach(evt=>{
        $infoClose.addEventListener(evt, closeNow, {passive:false});
      });
      document.addEventListener('click', (e)=>{
        const btn = e.target.closest('#infoClose,[data-action="close-overlay"]');
        if (btn){ e.preventDefault(); closeInfo(); }
      });
      $infoOverlay.addEventListener('click', (e)=>{
        if (e.target === $infoOverlay) closeInfo();
      });

      $board.addEventListener('pointerdown', onPointerDown, {passive:false});
      $board.addEventListener('pointermove', onPointerMove,  {passive:false});
      $board.addEventListener('pointerup',   onPointerUp,    {passive:false});
      $board.addEventListener('pointercancel', onPointerUp,  {passive:false});
      $board.addEventListener('wheel', onWheelPanZoom, {passive:false});

      $board.addEventListener('dblclick', (e)=>{
        if (state.draft) { centerOnDraft(1.0); return; }
        const p = toWorld(e.clientX, e.clientY);
        createDraftAt({x:p.x - NOTE.W/2, y:p.y - NOTE.H/2}, true);
      });

      document.addEventListener('keydown', (e) => {
        const ae = document.activeElement;
        const isEditing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable);
        if (isEditing) return;

        if (e.key === 'Escape') {
          if ($infoOverlay.classList.contains('open')) { closeInfo(); return; }
          if (state.panelOpen) { togglePanel(); return; }
        }
        if (e.key === 'ArrowLeft')  { CAMERA.x += 80; setCamVars_(); }

      });
    }

    /* ====== Title auto-fit ====== */
    function fitTitle(){
      const container = $title;
      if (!container) return;

      const vw = Math.max(document.documentElement.clientWidth, window.innerWidth || 0);
      let basePx =
        vw >= 1440 ? 34 :
        vw >= 1200 ? 30 :
        vw >= 900  ? 24 : 18;

      const minPx  = 12;
      $root.style.setProperty('--title-font-px', basePx + 'px');

      requestAnimationFrame(()=>{
        const w = Math.max(0, container.clientWidth - 2);
        const combined = container.querySelector('.lineCombined');
        if (combined){
          const scale = Math.min(1, w / Math.max(1, combined.scrollWidth));
          const px = Math.max(minPx, Math.floor(basePx * scale));
          $root.style.setProperty('--title-font-px', px + 'px');
        } else {
          const l1 = container.querySelector('.line1');
          const l2 = container.querySelector('.line2');
          let scale = 1;
          if (l1 && l1.scrollWidth > w) scale = Math.min(scale, w / l1.scrollWidth);
          if (l2 && l2.scrollWidth > w) scale = Math.min(scale, w / l2.scrollWidth);
          const px = Math.max(minPx, Math.floor(basePx * Math.min(1, scale)));
          $root.style.setProperty('--title-font-px', px + 'px');
        }
      });
    }

    /* ====== Draft ====== */
    function wireDraftForm_(root, d){
      const $nick = root.querySelector('#dNick');
      const $text = root.querySelector('#dText');
      const $fs   = root.querySelector('#dFs');
      const $submit = root.querySelector('#dSubmit');
      const $del    = root.querySelector('#dDelete');
      const $fsVal  = root.querySelector('.fsVal');

      const sync = () => {
        d.nick = ($nick.value || '').slice(0,27).trim();
        d.text = $text.value;
        d.fs = clamp(parseInt($fs.value,10)||16, 8, 36);
        $fsVal.textContent = d.fs+'pt';
        $text.style.fontSize = d.fs+'pt';
        saveDraft_(d);
        updateTopbarActions();
      };

      $nick.oninput = sync; $text.oninput = sync; $fs.oninput = sync;

      $submit.onclick = async () => {
        if (!d.nick) { d.nick = '익명'; $nick.value = '익명'; }
        if (!d.text) { alert('내용을 입력하세요.'); return; }
        if (!confirm('이 내용으로 제출하시겠습니까? 제출 후에는 수정/삭제가 불가합니다.')) return;

        $submit.disabled = true; $del.disabled = true; $submit.textContent = '✓';

        const maxX = Math.max(0, Math.min(WORLD.W, BOUNDS.W) - NOTE.W);
        const maxY = Math.max(0, Math.min(WORLD.H, BOUNDS.H) - NOTE.H);
        const x = Math.round(clamp(d.x||0, 0, maxX));
        const y = Math.round(clamp(d.y||0, 0, maxY));

        const fd = new URLSearchParams();
        fd.set('action','create');
        fd.set('owner', state.owner);
        fd.set('nick', d.nick);
        fd.set('text', d.text);
        fd.set('x', x);
        fd.set('y', y);
        fd.set('fs', d.fs||16);

        try{
          const res = await fetch(API, { method:'POST', body: fd, headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' } });
          const j = await res.json();
          if (!j.ok) { alert(j.error || '제출 실패'); $submit.disabled=false; $del.disabled=false; $submit.textContent='✓'; return; }
          const newNote = { id: j.id, owner: state.owner, nick: d.nick, text: d.text, status: 'submitted', ts: j.ts, tsKR: j.tsKR, x, y, fs: d.fs||16 };
          state.notes.push(sanitizeNote(newNote));
          state.draft = null; localStorage.removeItem('mn_draft');
          renderAll();
          refreshList();
        }catch(err){
          alert('네트워크 오류로 제출에 실패했습니다.\n(웹앱 배포 권한 또는 CORS 설정을 확인하세요)');
          $submit.disabled=false; $del.disabled=false; $submit.textContent='✓';
        }
      };

      $del.onclick = clearDraft;
    }

    function createDraftAt(pos, zoomToCenter=false){
      if (state.draft) { centerOnDraft(1.0); return; }
      const maxX = Math.max(0, Math.min(WORLD.W, BOUNDS.W) - NOTE.W);
      const maxY = Math.max(0, Math.min(WORLD.H, BOUNDS.H) - NOTE.H);
      const d = { nick:'', text:'', x: clamp(Math.round(pos.x||0), 0, maxX), y: clamp(Math.round(pos.y||0), 0, maxY), fs: 16 };
      state.draft = d; saveDraft_(state.draft); renderAll();
      if (zoomToCenter) centerOnDraft(1.0);
    }

    function centerOnDraft(scale=1.0){
      if (!state.draft) { alert('작성 중인 메모가 없습니다.'); return; }
      const d = state.draft;
      const center = { x: (d.x||0) + NOTE.W/2, y: (d.y||0) + NOTE.H/2 };
      setZoomAtCenter(scale);
      focusWorldPoint(center);
    }

    function clearDraft(){ state.draft = null; localStorage.removeItem('mn_draft'); renderAll(); updateTopbarActions(); }
    function saveDraft_(d){ localStorage.setItem('mn_draft', JSON.stringify(d)); updateTopbarActions(); }
    function loadDraft_(){ try{ return JSON.parse(localStorage.getItem('mn_draft')||'null'); }catch(e){ return null; } }

    /* ====== 카메라/좌표 ====== */
    function toWorld(cx, cy){
      const r = $board.getBoundingClientRect();
      const sx = cx - r.left, sy = cy - r.top;
      return { x: (sx - CAMERA.x) / CAMERA.scale, y: (sy - CAMERA.y) / CAMERA.scale };
    }
    function worldCenter(){
      const r = $board.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      return toWorld(cx, cy);
    }
    function focusWorldPoint(p){
      const r = $board.getBoundingClientRect();
      const cx = r.width / 2, cy = r.height / 2;
      CAMERA.x = cx - p.x * CAMERA.scale;
      CAMERA.y = cy - p.y * CAMERA.scale;
      setCamVars_();
    }
    function setZoomAtCenter(newScale){
      const r = $board.getBoundingClientRect();
      setZoomAtPoint(newScale, r.left + r.width/2, r.top + r.height/2);
    }
    function setZoomAtPoint(newScale, cx, cy){
      const ns = clamp(newScale, CAMERA.min, CAMERA.max);
      const before = CAMERA.scale;
      const r = $board.getBoundingClientRect();
      const sx = cx - r.left, sy = cy - r.top;
      const wx = (sx - CAMERA.x) / before, wy = (sy - CAMERA.y) / before;
      CAMERA.scale = ns;
      CAMERA.x = sx - wx * CAMERA.scale;
      CAMERA.y = sy - wy * CAMERA.scale;
      $zoomRangeTop.value = CAMERA.scale;
      setCamVars_();
    }
    function updateCamera(x,y,scale){ CAMERA.x = x; CAMERA.y = y; CAMERA.scale = scale; $zoomRangeTop.value = CAMERA.scale; setCamVars_(); }
    function setCamVars_(){ setVar('--scale', CAMERA.scale); setVar('--cam-x', CAMERA.x+'px'); setVar('--cam-y', CAMERA.y+'px'); updateMinimap(); }

    /* ====== Pan / Wheel / Pinch ====== */
    const pointers = new Map();
    const pinch = { active:false, lastDist:0, lastMid:{x:0,y:0} };

    function onPointerDown(ev){
      if (ev.pointerType === 'touch' && !ev.target.closest('input,textarea,button,select,.panel,.dragHandle,.ctrlBar,.fsDial')){
        const now = performance.now();
        const isNear = Math.hypot(ev.clientX - state.lastTapPos.x, ev.clientY - state.lastTapPos.y) < 30;
        if (now - state.lastTapTime < 300 && isNear) {
          if (state.draft) { centerOnDraft(1.0); }
          else {
            const p = toWorld(ev.clientX, ev.clientY);
            createDraftAt({x:p.x - NOTE.W/2, y:p.y - NOTE.H/2}, true);
          }
          state.lastTapTime = 0;
          ev.preventDefault();
          return;
        }
        state.lastTapTime = now;
        state.lastTapPos = {x: ev.clientX, y: ev.clientY};
      }

      if (ev.target.closest('input, textarea, button, select, .panel, .dragHandle, .ctrlBar, .fsDial')) return;
      if (ev.pointerType === 'mouse' && ev.button !== 1) return;

      stopInertia();
      $board.setPointerCapture(ev.pointerId);
      pointers.set(ev.pointerId, {x: ev.clientX, y: ev.clientY, t: performance.now()});

      if (pointers.size === 2){
        pinch.active = true;
        const [a,b] = [...pointers.values()];
        pinch.lastDist = Math.hypot(b.x - a.x, b.y - a.y);
        pinch.lastMid  = { x:(a.x+b.x)/2, y:(a.y+b.y)/2 };
      } else if (pointers.size === 1){
        pan.lastT = performance.now();
        $board.classList.add('panning');
      }

      ev.preventDefault();
    }

    function onPointerMove(ev){
      if (!pointers.has(ev.pointerId)) return;
      pointers.set(ev.pointerId, {x: ev.clientX, y: ev.clientY, t: performance.now()});

      if (pinch.active && pointers.size >= 2){
        const [a,b] = [...pointers.values()];
        const dist = Math.hypot(b.x - a.x, b.y - a.y);
        const mid  = { x:(a.x+b.x)/2, y:(a.y+b.y)/2 };
        if (pinch.lastDist > 0){
          const factor = dist / pinch.lastDist;
          setZoomAtPoint(CAMERA.scale * factor, mid.x, mid.y);
        }
        pinch.lastDist = dist; pinch.lastMid  = mid;
        return;
      }

      if (pointers.size === 1){
        const now = performance.now();
        const dt = Math.max(1, now - pan.lastT);
        const prev = state.panPrev || {x: ev.clientX, y: ev.clientY};
        const dx = ev.clientX - prev.x;
        const dy = ev.clientY - prev.y;

        pan.dx += dx; pan.dy += dy;
        if (!pan.raf){
          pan.raf = requestAnimationFrame(()=>{
            CAMERA.x += pan.dx; CAMERA.y += pan.dy;
            pan.dx = pan.dy = 0;
            setCamVars_();
            pan.raf = 0;
          });
        }

        const alpha = 0.2;
        const vx = dx / dt, vy = dy / dt;
        pan.lastVX = alpha * vx + (1-alpha) * pan.lastVX;
        pan.lastVY = alpha * vy + (1-alpha) * pan.lastVY;

        state.panPrev = {x: ev.clientX, y: ev.clientY};
        pan.lastT = now;
      }
    }

    function onPointerUp(ev){
      const wasDragging = (pointers.size === 1);
      pointers.delete(ev.pointerId);
      if (pointers.size < 2) { pinch.active = false; pinch.lastDist = 0; }
      if (pointers.size === 0){
        $board.classList.remove('panning');
        state.panPrev = null;
        const speed = Math.hypot(pan.lastVX, pan.lastVY);
        if (wasDragging && speed > 0.02) startInertia(pan.lastVX, pan.lastVY);
        pan.lastVX = pan.lastVY = 0;
      }
    }

    function startInertia(vx, vy){
      stopInertia();
      let last = performance.now();
      inertia.vx = vx; inertia.vy = vy;
      const tick = (now)=>{
        const dt = Math.min(48, now - last);
        last = now;
        CAMERA.x += inertia.vx * dt;
        CAMERA.y += inertia.vy * dt;
        setCamVars_();
        const damping = Math.pow(inertia.damping, dt / 16);
        inertia.vx *= damping; inertia.vy *= damping;
        if (Math.hypot(inertia.vx, inertia.vy) < 0.02) { stopInertia(); return; }
        inertia.raf = requestAnimationFrame(tick);
      };
      inertia.raf = requestAnimationFrame(tick);
    }

    function onWheelPanZoom(e){
      if (e.target.closest('input, textarea, button, select, .panel, .dragHandle, .ctrlBar, .fsDial')) return;
      e.preventDefault();
      stopInertia();
      if (e.ctrlKey) {
        const factor = Math.exp(-e.deltaY * 0.0015);
        setZoomAtPoint(CAMERA.scale * factor, e.clientX, e.clientY);
      } else {
        const k = 1;
        let dx = e.deltaX, dy = e.deltaY;
        if (Math.abs(dx) < 1 && e.shiftKey) dx = dy;
        CAMERA.x -= dx * k; CAMERA.y -= dy * k;
        setCamVars_();
      }
    }

    /* ====== Minimap ====== */
    function updateMinimap(){
      const ctx = $minimap.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const cssW = $miniWrap.clientWidth || 160, cssH = $miniWrap.clientHeight || 160;
      $minimap.width = Math.round(cssW * dpr); $minimap.height = Math.round(cssH * dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.clearRect(0,0, cssW, cssH);
      ctx.fillStyle = '#0b0e13'; ctx.fillRect(0,0, cssW, cssH);
      ctx.strokeStyle = '#293241'; ctx.strokeRect(0.5,0.5, cssW-1, cssH-1);

      const sx = cssW / BOUNDS.W, sy = cssH / BOUNDS.H, s = Math.min(sx, sy);
      ctx.fillStyle = '#9ab6ff';
      const dot = Math.max(2, Math.round(NOTE.W * s * 0.5));
      const maxX = Math.max(0, Math.min(WORLD.W, BOUNDS.W) - NOTE.W);
      const maxY = Math.max(0, Math.min(WORLD.H, BOUNDS.H) - NOTE.H);
      for (const n of state.notes){
        const nx = clamp(n.x||0, 0, maxX);
        const ny = clamp(n.y||0, 0, maxY);
        ctx.fillRect(Math.round(nx*s), Math.round(ny*s), dot, dot);
      }
      if (state.draft){
        const dx = clamp(state.draft.x||0, 0, maxX);
        const dy = clamp(state.draft.y||0, 0, maxY);
        ctx.fillStyle = '#ffb86b';
        ctx.fillRect(Math.round(dx*s), Math.round(dy*s), dot, dot);
      }

      const r = $board.getBoundingClientRect();
      const wx = clamp(-CAMERA.x / CAMERA.scale, 0, BOUNDS.W);
      const wy = clamp(-CAMERA.y / CAMERA.scale, 0, BOUNDS.H);
      const ww = Math.min(r.width / CAMERA.scale, BOUNDS.W);
      const wh = Math.min(r.height / CAMERA.scale, BOUNDS.H);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
      ctx.strokeRect(Math.round(wx*s)+0.5, Math.round(wy*s)+0.5, Math.max(10, ww*s), Math.max(10, wh*s));
    }

    function goMinimap(e){
      const rect = $miniWrap.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      const cssW = rect.width, cssH = rect.height;
      const sx = cssW / BOUNDS.W, sy = cssH / BOUNDS.H, s = Math.min(sx, sy);
      const wx = x / s, wy = y / s;
      focusWorldPoint({ x: wx, y: wy });
    }
    $miniWrap.addEventListener('pointerdown', (e) => { mm.dragging = true; goMinimap(e); e.preventDefault(); });
    $miniWrap.addEventListener('pointermove', (e) => { if (mm.dragging) { goMinimap(e); e.preventDefault(); } });
    const mm = { dragging:false };
    const mmEnd = () => { mm.dragging = false; };
    $miniWrap.addEventListener('pointerup', mmEnd);
    $miniWrap.addEventListener('pointercancel', mmEnd);

    /* ====== Capture ====== */
    async function captureElem(el, filename){
      try{
        if (!window.html2canvas) throw new Error('no html2canvas');
        const canvas = await html2canvas(el, {backgroundColor: null, useCORS: true, scale: 2});
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = filename || 'capture.png';
        a.click();
      }catch(e){
        window.print();
      }
    }

    /* ====== Markdown renderer (safe subset) ====== */
    function mdToHtml(md){
      const esc = (s)=> String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
      const lines = String(md||'').replace(/\r\n?/g,'\n').split('\n');

      const inline = (t)=>{
        t = esc(t);
        t = t.replace(/`([^`]+?)`/g, '<code>$1</code>');
        t = t.replace(/\[([^\]]+?)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        t = t.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
        t = t.replace(/_([^_]+?)_/g, '<em>$1</em>');
        return t;
      };

      let html = '';
      let inList = false;
      const flushList = ()=>{ if (inList){ html += '</ul>'; inList=false; } };

      for (let raw of lines){
        const line = raw;
        if (/^\s*[-*]\s+/.test(line)){
          if (!inList){ html += '<ul>'; inList = true; }
          const item = line.replace(/^\s*[-*]\s+/, '');
          html += `<li>${inline(item)}</li>`;
          continue;
        }
        flushList();

        if (/^\s*#{3}\s+/.test(line)) { html += `<h4>${inline(line.replace(/^\s*#{3}\s+/,''))}</h4>`; continue; }
        if (/^\s*#{2}\s+/.test(line)) { html += `<h3>${inline(line.replace(/^\s*#{2}\s+/,''))}</h3>`; continue; }
        if (/^\s*#\s+/.test(line))    { html += `<h2>${inline(line.replace(/^\s*#\s+/,''))}</h2>`; continue; }

        if (line.trim()===''){ html += ''; continue; }
        html += `<p>${inline(line)}</p>`;
      }
      flushList();
      return html;
    }

    /* ====== Utils ====== */
    function setVar(k, v){ document.documentElement.style.setProperty(k, v); }
    function toStr(v){ return v == null ? '' : (typeof v === 'string' ? v : String(v)); }
    function nickOrAnon(n){ return (n.nick && String(n.nick).trim()) ? n.nick : '익명'; }
    function getOrSetOwner_(){ let id = localStorage.getItem('mn_owner'); if (!id) { id = cryptoRandomId_(); localStorage.setItem('mn_owner', id); } return id; }
    function cryptoRandomId_(){ const a = new Uint8Array(16); crypto.getRandomValues(a); return [...a].map(x=>x.toString(16).padStart(2,'0')).join(''); }
    function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
    function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    function escapeAttr(s){ return String(s).replace(/"/g, '&quot;'); }
    function escapeText(s){ return String(s).replace(/</g, '&lt;'); }

    function autoFitText(el, preferredPt, minPt){
      let pt = Math.max(minPt||8, preferredPt||14);
      el.style.fontSize = pt + 'pt';
      const maxLoops = 30; let loops = 0;
      while (loops < maxLoops && el.scrollHeight > el.clientHeight && pt > (minPt||8)) {
        const ratio = el.clientHeight / Math.max(1, el.scrollHeight);
        pt = Math.max(minPt||8, Math.floor(Math.min(pt - 1, pt * (ratio * 0.98))));
        el.style.fontSize = pt + 'pt'; loops++;
      }
    }

    function sanitizeNote(n){
      const maxX = Math.max(0, Math.min(WORLD.W, BOUNDS.W) - NOTE.W);
      const maxY = Math.max(0, Math.min(WORLD.H, BOUNDS.H) - NOTE.H);
      return {
        ...n,
        nick: toStr(n.nick), text: toStr(n.text), tsKR: toStr(n.tsKR), ts: toStr(n.ts),
        status: (n.status||'').toString().toLowerCase(),
        x: clamp(Number(n.x)||0, 0, maxX), y: clamp(Number(n.y)||0, 0, maxY),
        fs: clamp(Number(n.fs) || 16, 8, 36)
      };
    }

    function clampDraftToWorld_(d){
      const maxX = Math.max(0, Math.min(WORLD.W, BOUNDS.W) - NOTE.W);
      const maxY = Math.max(0, Math.min(WORLD.H, BOUNDS.H) - NOTE.H);
      d.x = clamp(Number(d.x)||0, 0, maxX);
      d.y = clamp(Number(d.y)||0, 0, maxY);
    }

    function bringToFrontEl(el){
      const id = el.dataset.id || '';
      const note = getNoteById(id);
      const status = (note && note.status) || 'approved';
      const tier = (status === 'submitted') ? 'submitted' : 'approved';
      const base = (tier === 'submitted') ? 9000 : 8000;
      state.zCounters[tier] = (state.zCounters[tier] || 0) + 1;
      const z = Math.min(9998, base + state.zCounters[tier]);
      state.zMap[id] = z;
      el.style.zIndex = z;
    }
    function findNoteElById(id){ return $world.querySelector(`.note[data-id="${(window.CSS&&CSS.escape)?CSS.escape(String(id||'')):String(id||'').replace(/[^a-zA-Z0-9_-]/g,'\\$&')}"]`); }
    function getNoteById(id){ return state.notes.find(n => (n.id||'') === (id||'')); }
    function moveToNote(n){
      if (CAMERA.scale < 0.85 || CAMERA.scale > 1.2) setZoomAtCenter(1.0);
      const center = { x: clamp((n.x||0)+NOTE.W/2, 0, BOUNDS.W), y: clamp((n.y||0)+NOTE.H/2, 0, BOUNDS.H) };
      focusWorldPoint(center);
      const el = findNoteElById(n.id); if (el) bringToFrontEl(el);
    }
    function focusNote(n){
      const center = { x: clamp((n.x||0)+NOTE.W/2, 0, BOUNDS.W), y: clamp((n.y||0)+NOTE.H/2, 0, BOUNDS.H) };
      focusWorldPoint(center);
      const el = findNoteElById(n.id); if (el) bringToFrontEl(el);
      if (!state.panelOpen) togglePanel();
    }

    function updateTopbarActions(){
      const hasDraft = !!state.draft;
      $btnNew.style.display = hasDraft ? 'none' : '';
      $btnGo.style.display  = hasDraft ? '' : 'none';
      $btnDel.style.display = hasDraft ? '' : 'none';
    }

    function enableDrag(el, ondrag, handleSelector){
      const handle = handleSelector ? el.querySelector(handleSelector) : el;
      let prev = null;
      handle.addEventListener('pointerdown', (ev)=>{
        prev = {x:ev.clientX, y:ev.clientY};
        handle.setPointerCapture(ev.pointerId);
        ev.stopPropagation();
      });
      handle.addEventListener('pointermove', (ev)=>{
        if (!prev) return;
        const dx = ev.clientX - prev.x, dy = ev.clientY - prev.y;
        prev = {x:ev.clientX, y:ev.clientY};
        ondrag(dx, dy);
      });
      const end = ()=> { prev=null; };
      handle.addEventListener('pointerup', end);
      handle.addEventListener('pointercancel', end);
    }
  </script>
