<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>온라인 포스트잇 게시판</title>
  <style>
    :root{
      --bg:#0f1115;
      --text:#e8eaed;
      --title-color:#ffffff;
      --title-align:center;
      --postit-image:none;
      --board-image:none;
      --note-size: 280px;
      --panel-width: 320px;
      --cam-x: 0px;
      --cam-y: 0px;
      --scale: 1;
    }
    *{ box-sizing:border-box; }
    html,body{ margin:0; height:100%; background:var(--bg); color:var(--text); font-family:"Noto Sans KR",system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    button{ cursor:pointer; }

    .app{ display:grid; grid-template-rows:auto 1fr; height:100%; }

    /* Top bar */
    .topbar{
      position:relative; display:grid; grid-template-columns: auto 1fr auto;
      gap:8px; align-items:center; padding:10px 12px; border-bottom:1px solid #20242b; background:#0b0e13aa; backdrop-filter: blur(6px);
    }
    .title{ text-align:var(--title-align); color:var(--title-color); font-weight:700; font-size:18px; letter-spacing:.2px; }
    .iconbtn{
      background:#1a1f27; border:1px solid #252b35; color:#d9e3f0; padding:8px 12px; border-radius:10px; min-width:44px; min-height:36px;
    }

    /* Layout */
    .main{ position:relative; height:100%; overflow:hidden; }
    .panel{
      position:absolute; top:0; bottom:0; width:var(--panel-width);
      background:#0b0e13f2; border-right:1px solid #1f2430; z-index:20;
      transform: translateX(calc(var(--panel-x, -100%)));
      transition: transform .25s ease; overflow:auto; padding:12px;
    }
    .panel.right{ left:auto; right:0; border-right:none; border-left:1px solid #1f2430; }
    .panel.open{ --panel-x: 0%; }

    .panel h3{ margin:6px 0 8px; font-size:14px; color:#b7c2cf; }
    .list li{ list-style:none; margin:0 0 10px; padding:10px; border:1px solid #273040; background:#0f131a; }
    .list b{ color:#fff; }
    .list .meta{ color:#8b98a7; font-size:12px; }
    .list .row{ display:flex; gap:8px; margin-top:6px; }
    .list .row button{ flex:1; }

    /* Board */
    .board{
      position:absolute; inset:0; background-image: var(--board-image);
      background-position:center; background-size:cover; background-repeat:no-repeat; cursor: grab;
    }
    .board.panning{ cursor: grabbing; }

    /* TOP-LEFT ORIGIN */
    .world{
      position:absolute; left:0; top:0;
      transform: translate(var(--cam-x), var(--cam-y)) scale(var(--scale));
      transform-origin: 0 0;
      width:30000px; height:30000px;
    }

    /* Note */
    .note{
      position:absolute; width:var(--note-size); height:var(--note-size);
      background-image: var(--postit-image);
      background-size: cover; background-position:center; background-repeat:no-repeat;
      border-radius:0; /* ← 각지게 */
      padding:12px; border:1px solid #2a3342; color:#0b0f14;
      box-shadow: 0 8px 24px rgba(0,0,0,.28);
      display:flex; flex-direction:column; justify-content:space-between;
    }
    .note .nick{ font-weight:700; margin-bottom:6px; color:#111; }
    .note .body{ white-space:pre-wrap; line-height:1.25; color:#111; overflow:auto; }
    .note .ts{ color:#333; font-size:11px; text-align:right; }

    .note.draft{ outline: 3px dashed #ff8c00; outline-offset: 0; }
    .note .controls{ display:flex; gap:6px; margin-top:8px; }
    .note .controls button{ flex:1; padding:8px 10px; border-radius:10px; border:1px solid #d4d4d4; background:#fff; color:#111; }
    .note .controls button.del{ background:#ffe8e8; border-color:#f3b6b6; }

    .form input, .form textarea, .form .row input[type="range"]{
      width:100%; padding:8px 10px; border-radius:10px; border:1px solid #cfd9e3; outline:none; font-family:inherit; background:#fff; color:#111;
    }
    .form textarea{ height:120px; resize:none; }
    .dragbar{ cursor:grab; user-select:none; padding:6px 8px; margin:-6px -6px 8px; border:1px dashed #bbb; text-align:center; color:#333; background:#f7f7f7; }
    .dragbar:active{ cursor:grabbing; }

    /* Right tools */
    .tools{
      position:absolute; right:12px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:8px; z-index:15;
    }
    .zoomdock{ background:#10151d; border:1px solid #293241; padding:10px; border-radius:12px; }
    .zoomrow{ display:flex; align-items:center; gap:8px; }
    .zoomrow input[type="range"]{ width:140px; }
    .tool{ background:#10151d; border:1px solid #293241; color:#dce7f5; padding:10px 12px; border-radius:12px; min-width:44px; }

    /* FABs */
    .fabs{ position:absolute; right:16px; bottom:16px; z-index:16; display:flex; flex-direction:column; gap:8px; }
    .fab{ background:#2563eb; border:none; color:white; font-weight:700; padding:14px 16px; border-radius:999px; box-shadow:0 8px 24px rgba(0,0,0,.25); min-width:56px; min-height:56px; }
    .fab.secondary{ background:#475569; }
    .fab.warn{ background:#ea580c; }

    .hide{ display:none !important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <button id="btnPanel" class="iconbtn" title="리스트">🗂️</button>
      <div class="title" id="title">온라인 포스트잇 게시판</div>
      <button id="btnPing" class="iconbtn" title="새로고침">↻</button>
    </div>

    <div class="main">
      <aside id="panel" class="panel">
        <h3>메모 목록</h3>
        <ul id="list" class="list"></ul>
      </aside>

      <div class="board" id="board">
        <div class="world" id="world"></div>
      </div>

      <div class="tools">
        <div class="zoomdock">
          <div class="zoomrow">
            <button id="zoomOut" class="tool" title="축소">−</button>
            <input id="zoomRange" type="range" min="0.5" max="2.0" step="0.01" value="1" />
            <button id="zoomIn" class="tool" title="확대">＋</button>
          </div>
        </div>
        <button id="fitAll" class="tool">⤢ 전체</button>
        <button id="capBoard" class="tool">📷 캡처</button>
      </div>

      <div class="fabs">
        <button id="newDraft" class="fab">＋ 새 포스트잇</button>
        <button id="gotoDraft" class="fab secondary hide">⇢ 작성중 이동</button>
        <button id="clearDraft" class="fab warn hide">삭제</button>
      </div>
    </div>
  </div>

  <script>
    /* ====== Config ====== */
    const API = 'https://script.google.com/macros/s/AKfycbwOP7ZP3VL84Ax2hwaZroNRG9HREJyZ6IJWpjCQGUnDZAmhdZhyRaEcIOkXC-j0YDhM5A/exec'; // 교체
    const NOTE = { W: 280, H: 280 };
    const CAMERA = { x: 0, y: 0, scale: 1, min: .5, max: 2 };

    /* ====== State ====== */
    const state = {
      owner: getOrSetOwner_(),
      settings: null,
      notes: [],
      draft: loadDraft_(),          // {nick,text,x,y,fs}
      panelOpen: false,
      lastTapTime: 0,
      lastTapPos: {x:0,y:0},
      isPanning: false,
      panPrev: null
    };

    const $root = document.documentElement;
    const $title = document.getElementById('title');
    const $panel = document.getElementById('panel');
    const $list  = document.getElementById('list');
    const $world = document.getElementById('world');
    const $board = document.getElementById('board');
    const $zoomRange = document.getElementById('zoomRange');
    const $fabNew = document.getElementById('newDraft');
    const $fabGo  = document.getElementById('gotoDraft');
    const $fabDel = document.getElementById('clearDraft');

    /* ====== Boot ====== */
    (async function init(){
      await bootstrap();
      bindUI();
      renderAll();
      updateFabs();
    })();

    async function bootstrap(){
      const url = `${API}?action=bootstrap&owner=${encodeURIComponent(state.owner)}`;
      const j = await (await fetch(url)).json();
      if (!j.ok) throw new Error('bootstrap failed');

      const s = j.settings.values;
      state.settings = j.settings;

      $title.textContent = toStr(s.screenTitle || '온라인 포스트잇 게시판');
      document.title = toStr(s.pageTitle || $title.textContent);
      setVar('--title-align', s.titleAlign || 'center');
      setVar('--bg', s.bgColor || '#0f1115');

      const ns = parseInt(s.noteSizePx || '280', 10);
      NOTE.W = NOTE.H = ns; setVar('--note-size', ns+'px');

      CAMERA.min = parseFloat(s.zoomMin || '0.5') || .5;
      CAMERA.max = parseFloat(s.zoomMax || '2.0') || 2;
      CAMERA.scale = parseFloat(s.zoomDefault || '1.0') || 1;
      $zoomRange.min = CAMERA.min; $zoomRange.max = CAMERA.max; $zoomRange.value = CAMERA.scale;

      if (j.settings.assets && j.settings.assets.bg) setVar('--board-image', `url(${j.settings.assets.bg})`);
      if (j.settings.assets && j.settings.assets.postit) setVar('--postit-image', `url(${j.settings.assets.postit})`);

      const dock = (s.panelDock || 'left');
      document.querySelector('.panel').classList.toggle('right', dock === 'right');

      state.notes = (j.data || []).map(sanitizeNote);

      if (state.draft) saveDraft_(Object.assign({}, state.draft));

      updateCamera(0, 0, CAMERA.scale);
      fitAll();
    }

    /* ====== UI ====== */
    function bindUI(){
      document.getElementById('btnPanel').onclick = togglePanel;
      document.getElementById('btnPing').onclick = async ()=>{ await refreshList(); fitAll(); };

      document.getElementById('zoomIn').onclick  = () => setZoomAtCenter(CAMERA.scale * 1.1);
      document.getElementById('zoomOut').onclick = () => setZoomAtCenter(CAMERA.scale / 1.1);
      $zoomRange.oninput = e => setZoomAtCenter(parseFloat(e.target.value));
      document.getElementById('fitAll').onclick = fitAll;
      document.getElementById('capBoard').onclick = () => captureElem($board, 'board.png');

      $fabNew.onclick = () => createDraftAt({x:100, y:100});
      $fabDel.onclick = clearDraft;
      $fabGo.onclick  = goToDraft;

      // Pan
      $board.addEventListener('pointerdown', onPanStart, {passive:false});
      $board.addEventListener('pointermove', onPanMove,  {passive:false});
      $board.addEventListener('pointerup',   onPanEnd,   {passive:false});
      $board.addEventListener('pointercancel', onPanEnd, {passive:false});
      $board.addEventListener('wheel', onWheelPanZoom, {passive:false});

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && state.panelOpen) togglePanel();
        if (e.key === 'ArrowLeft')  { CAMERA.x += 80; setCamVars_(); }
        if (e.key === 'ArrowRight') { CAMERA.x -= 80; setCamVars_(); }
        if (e.key === 'ArrowUp')    { CAMERA.y += 80; setCamVars_(); }
        if (e.key === 'ArrowDown')  { CAMERA.y -= 80; setCamVars_(); }
      });
    }

    function togglePanel(){ state.panelOpen = !state.panelOpen; $panel.classList.toggle('open', state.panelOpen); }

    async function refreshList(){
      const url = `${API}?action=list&owner=${encodeURIComponent(state.owner)}`;
      const j = await (await fetch(url)).json();
      if (j.ok) { state.notes = (j.data || []).map(sanitizeNote); renderAll(); }
    }

    /* ====== Rendering ====== */
    function renderAll(){ renderNotes(); renderList(); updateFabs(); }

    function renderNotes(){
      $world.innerHTML = '';
      for (const n of state.notes) {
        const el = document.createElement('div');
        el.className = 'note';
        el.style.left = (n.x || 0) + 'px';
        el.style.top  = (n.y || 0) + 'px';
        el.style.width = NOTE.W+'px';
        el.style.height = NOTE.H+'px';
        const fs = (n.fs ? (n.fs + 'pt') : '14pt');
        el.innerHTML = `
          <div class="nick">${escapeHtml(toStr(n.nick))}</div>
          <div class="body" style="font-size:${fs}">${escapeHtml(toStr(n.text))}</div>
          <div class="ts">${formatStamp(n.tsKR, n.ts)}</div>
        `;
        el.addEventListener('dblclick', () => focusNote(n));
        $world.appendChild(el);
      }

      if (state.draft) {
        const d = state.draft;
        const el = document.createElement('div');
        el.className = 'note draft';
        el.style.left = (d.x || 0) + 'px';
        el.style.top  = (d.y || 0) + 'px';
        el.style.width = NOTE.W+'px';
        el.style.height = NOTE.H+'px';
        el.innerHTML = makeDraftFormHTML_(d);

        // Drag ONLY from dragbar
        enableDrag(el, (dx, dy) => {
          d.x = (d.x||0) + dx / CAMERA.scale;
          d.y = (d.y||0) + dy / CAMERA.scale;
          saveDraft_(d);
          el.style.left = d.x + 'px';
          el.style.top  = d.y + 'px';
        }, '.dragbar');

        wireDraftForm_(el, d);
        $world.appendChild(el);
      }
    }

    function renderList(){
      const items = [...state.notes].sort((a,b)=> (+new Date(a.ts||a.tsKR)) - (+new Date(b.ts||b.tsKR)));
      $list.innerHTML = '';
      for (const n of items) {
        const li = document.createElement('li');
        const when = formatStamp(n.tsKR, n.ts);
        const txt = toStr(n.text);
        const cut = txt.length > 120 ? txt.slice(0,120) + '…' : txt;
        li.innerHTML = `
          <div><b>${escapeHtml(toStr(n.nick))}</b></div>
          <div class="meta">${when}</div>
          <div class="meta">${escapeHtml(cut)}</div>
          <div class="row">
            <button>보기</button>
            <button>캡처</button>
          </div>
        `;
        const [btnView, btnCap] = li.querySelectorAll('button');
        btnView.onclick = () => focusNote(n);
        btnCap.onclick  = async () => {
          const node = [...$world.children].find(el => {
            const left = parseFloat(el.style.left||0), top = parseFloat(el.style.top||0);
            return Math.abs(left - (n.x||0))<1 && Math.abs(top - (n.y||0))<1;
          });
          if (node) await captureElem(node, `note-${(n.id||'')}.png`);
        };
        $list.appendChild(li);
      }
    }

    function focusNote(n){
      const center = { x: (n.x||0) + NOTE.W/2, y: (n.y||0) + NOTE.H/2 };
      focusWorldPoint(center);
      if (!state.panelOpen) togglePanel();
    }

    function goToDraft(){
      if (!state.draft) { alert('작성 중인 메모가 없습니다.'); return; }
      const d = state.draft;
      const center = { x: (d.x||0) + NOTE.W/2, y: (d.y||0) + NOTE.H/2 };
      focusWorldPoint(center);
    }

    function fitAll(){
      const rects = [];
      for (const n of state.notes) rects.push({x:n.x||0,y:n.y||0,w:NOTE.W,h:NOTE.H});
      if (state.draft) rects.push({x:state.draft.x||0,y:state.draft.y||0,w:NOTE.W,h:NOTE.H});
      if (!rects.length) { setZoomAtCenter(CAMERA.scale); return; }

      const bb = boundsOf(rects);
      const pad = 80;
      const vw = $board.clientWidth - pad*2;
      const vh = $board.clientHeight - pad*2;
      const s1 = vw / (bb.w||1);
      const s2 = vh / (bb.h||1);
      const s = clamp(Math.min(s1, s2), CAMERA.min, CAMERA.max);
      setZoomAtCenter(s);

      const center = { x: bb.x + bb.w/2, y: bb.y + bb.h/2 };
      focusWorldPoint(center, false);
    }

    /* ====== Draft ====== */
    function makeDraftFormHTML_(d){
      const fs = d.fs || 16;
      return `
        <div class="form">
          <div class="dragbar" title="이 막대를 드래그해서 이동">⋮⋮ 드래그</div>
          <input id="dNick" maxlength="12" placeholder="닉네임(최대 12자)" value="${escapeAttr(toStr(d.nick||''))}">
          <div class="row" style="display:flex; gap:8px; align-items:center; margin:6px 0;">
            <div style="color:#222; font-size:12px; min-width:54px;">글자크기</div>
            <input id="dFs" type="range" min="10" max="48" step="1" value="${fs}">
            <div style="color:#222; font-size:12px; min-width:30px;">${fs}pt</div>
          </div>
          <textarea id="dText" placeholder="내용을 입력하세요 (제출 후 수정/삭제 불가)">${escapeText(toStr(d.text||''))}</textarea>
          <div class="controls">
            <button id="dSubmit">제출</button>
            <button id="dDelete" class="del">삭제</button>
          </div>
        </div>
      `;
    }

    function wireDraftForm_(root, d){
      const $nick = root.querySelector('#dNick');
      const $text = root.querySelector('#dText');
      const $fs   = root.querySelector('#dFs');
      const $submit = root.querySelector('#dSubmit');
      const $del    = root.querySelector('#dDelete');
      const $fsVal  = $fs.nextElementSibling;

      const sync = () => {
        d.nick = $nick.value.trim(); d.text = $text.value; d.fs = parseInt($fs.value,10)||16;
        $fsVal.textContent = d.fs+'pt';
        saveDraft_(d);
      };

      $nick.oninput = sync; $text.oninput = sync; $fs.oninput = sync;

      $submit.onclick = async () => {
        if (!d.nick || !d.text) { alert('닉네임과 내용을 입력하세요.'); return; }
        const fd = new URLSearchParams();
        fd.set('action','create');
        fd.set('owner', state.owner);
        fd.set('nick', d.nick);
        fd.set('text', d.text);
        fd.set('x', Math.round(d.x||0));
        fd.set('y', Math.round(d.y||0));
        fd.set('fs', d.fs||16);

        const res = await fetch(API, { method:'POST', body: fd });
        const j = await res.json();
        if (!j.ok) { alert(j.error || '제출 실패'); return; }

        clearDraft();
        await refreshList();
        fitAll();
        alert('제출되었습니다. 승인 후 모두에게 보입니다.');
      };

      $del.onclick = clearDraft;
    }

    function createDraftAt(pos){
      if (state.draft) { alert('작성 중인 메모가 이미 있습니다. 먼저 제출 또는 삭제하세요.'); return; }
      state.draft = { nick: '', text: '', x: Math.max(0, Math.round(pos.x||0)), y: Math.max(0, Math.round(pos.y||0)), fs: 16 };
      saveDraft_(state.draft);
      renderAll();
    }

    function clearDraft(){ state.draft = null; localStorage.removeItem('mn_draft'); renderAll(); }
    function saveDraft_(d){ localStorage.setItem('mn_draft', JSON.stringify(d)); }
    function loadDraft_(){ try{ return JSON.parse(localStorage.getItem('mn_draft')||'null'); }catch(e){ return null; } }
    function updateFabs(){ const hasDraft = !!state.draft; $fabGo.classList.toggle('hide', !hasDraft); $fabDel.classList.toggle('hide', !hasDraft); }

    /* ====== Camera & Geometry (TOP-LEFT ORIGIN) ====== */
    function toWorld(cx, cy){
      const r = $board.getBoundingClientRect();
      const sx = cx - r.left;
      const sy = cy - r.top;
      return { x: (sx - CAMERA.x) / CAMERA.scale, y: (sy - CAMERA.y) / CAMERA.scale };
    }
    function focusWorldPoint(p){
      const r = $board.getBoundingClientRect();
      const cx = r.width / 2;
      const cy = r.height / 2;
      CAMERA.x = cx - p.x * CAMERA.scale;
      CAMERA.y = cy - p.y * CAMERA.scale;
      setCamVars_();
    }
    function setZoomAtCenter(newScale){
      const r = $board.getBoundingClientRect();
      const cx = r.left + r.width/2;
      const cy = r.top  + r.height/2;
      setZoomAtPoint(newScale, cx, cy);
    }
    function setZoomAtPoint(newScale, cx, cy){
      const ns = clamp(newScale, CAMERA.min, CAMERA.max);
      const before = CAMERA.scale;
      const r = $board.getBoundingClientRect();
      const sx = cx - r.left;
      const sy = cy - r.top;
      const wx = (sx - CAMERA.x) / before;
      const wy = (sy - CAMERA.y) / before;
      CAMERA.scale = ns;
      CAMERA.x = sx - wx * CAMERA.scale;
      CAMERA.y = sy - wy * CAMERA.scale;
      $zoomRange.value = CAMERA.scale;
      setCamVars_();
    }
    function updateCamera(x,y,scale){ CAMERA.x = x; CAMERA.y = y; CAMERA.scale = scale; $zoomRange.value = CAMERA.scale; setCamVars_(); }
    function setCamVars_(){ setVar('--scale', CAMERA.scale); setVar('--cam-x', CAMERA.x+'px'); setVar('--cam-y', CAMERA.y+'px'); }
    function boundsOf(rects){
      const xs = rects.map(r=>r.x), ys = rects.map(r=>r.y);
      const xe = rects.map(r=>r.x+r.w), ye = rects.map(r=>r.y+r.h);
      const minx = Math.min(...xs), miny = Math.min(...ys);
      const maxx = Math.max(...xe), maxy = Math.max(...ye);
      return { x:minx, y:miny, w:maxx-minx, h:maxy-miny };
    }

    /* ====== Pan / Wheel (with input-safe guards) ====== */
    function onPanStart(ev){
      // 노트/입력/버튼/패널/툴스 안에서 시작하면 패닝 비활성화 (입력 가능)
      if (ev.target.closest('.note, input, textarea, button, select, .panel, .tools')) return;

      state.isPanning = true;
      state.panPrev = {x: ev.clientX, y: ev.clientY};
      $board.classList.add('panning');

      // 더블탭(모바일)로 새 메모 생성
      const now = Date.now();
      const dt  = now - state.lastTapTime;
      const dist = Math.hypot(ev.clientX - state.lastTapPos.x, ev.clientY - state.lastTapPos.y);
      if (dt < 300 && dist < 12) {
        const wpt = toWorld(ev.clientX, ev.clientY);
        createDraftAt({x:wpt.x - NOTE.W/2, y:wpt.y - NOTE.H/2});
        state.lastTapTime = 0;
      } else {
        state.lastTapTime = now;
        state.lastTapPos = {x: ev.clientX, y: ev.clientY};
      }

      ev.preventDefault(); // 텍스트 선택 방지 (단, 위 가드로 입력에는 영향 없음)
    }
    function onPanMove(ev){
      if (!state.isPanning || !state.panPrev) return;
      const dx = ev.clientX - state.panPrev.x;
      const dy = ev.clientY - state.panPrev.y;
      state.panPrev = {x: ev.clientX, y: ev.clientY};
      CAMERA.x += dx;
      CAMERA.y += dy;
      setCamVars_();
      ev.preventDefault();
    }
    function onPanEnd(){ state.isPanning = false; state.panPrev = null; $board.classList.remove('panning'); }

    function onWheelPanZoom(e){
      // 입력/노트/패널/툴스 위에서는 무시
      if (e.target.closest('.note, input, textarea, button, select, .panel, .tools')) return;
      e.preventDefault();
      if (e.ctrlKey) {
        const factor = Math.exp(-e.deltaY * 0.0015);
        setZoomAtPoint(CAMERA.scale * factor, e.clientX, e.clientY);
      } else {
        const k = 1;
        let dx = e.deltaX, dy = e.deltaY;
        if (Math.abs(dx) < 1 && e.shiftKey) dx = dy;
        CAMERA.x -= dx * k;
        CAMERA.y -= dy * k;
        setCamVars_();
      }
    }

    /* ====== Capture ====== */
    async function captureElem(el, filename){
      try{
        if (!window.html2canvas) throw new Error('no html2canvas');
        const canvas = await html2canvas(el, {backgroundColor: null, useCORS: true, scale: 2});
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = filename || 'capture.png';
        a.click();
      } catch (e) { window.print(); }
    }

    /* ====== Utils ====== */
    function toStr(v){ return v == null ? '' : (typeof v === 'string' ? v : String(v)); }
    function formatStamp(tsKR, ts){ if (toStr(tsKR)) return toStr(tsKR); try { return ts ? new Date(ts).toLocaleString('ko-KR') : ''; } catch(e){ return ''; } }
    function getOrSetOwner_(){ let id = localStorage.getItem('mn_owner'); if (!id) { id = cryptoRandomId_(); localStorage.setItem('mn_owner', id); } return id; }
    function cryptoRandomId_(){ const a = new Uint8Array(16); crypto.getRandomValues(a); return [...a].map(x=>x.toString(16).padStart(2,'0')).join(''); }
    function setVar(k, v){ $root.style.setProperty(k, v); }
    function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
    function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    function escapeAttr(s){ return String(s).replace(/"/g, '&quot;'); }
    function escapeText(s){ return String(s).replace(/</g, '&lt;'); }

    function sanitizeNote(n){
      return {
        ...n,
        nick: toStr(n.nick),
        text: toStr(n.text),
        tsKR: toStr(n.tsKR),
        ts: toStr(n.ts),
        x: Number(n.x) || 0,
        y: Number(n.y) || 0,
        fs: Number(n.fs) || 16
      };
    }

    // enableDrag with optional handle
    function enableDrag(el, ondrag, handleSelector){
      const handle = handleSelector ? el.querySelector(handleSelector) : el;
      let prev = null;
      handle.addEventListener('pointerdown', (ev)=>{
        prev = {x:ev.clientX, y:ev.clientY};
        handle.setPointerCapture(ev.pointerId);
        ev.stopPropagation(); // 보드 패닝과 충돌 방지
      });
      handle.addEventListener('pointermove', (ev)=>{
        if (!prev) return;
        const dx = ev.clientX - prev.x, dy = ev.clientY - prev.y;
        prev = {x:ev.clientX, y:ev.clientY};
        ondrag(dx, dy);
      });
      const end = ()=> { prev=null; };
      handle.addEventListener('pointerup', end);
      handle.addEventListener('pointercancel', end);
    }
  </script>
