<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- 모바일 핀치줌은 보드 내부에서 처리 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>온라인 포스트잇 게시판</title>
  <style>
    :root{
      --bg:#0f1115;
      --text:#e8eaed;
      --title-color:#ffffff;
      --title-align:center;
      --postit-image:none;
      --board-image:none;
      --note-size: 280px;
      --panel-width: 320px;
      --cam-x: 0px;
      --cam-y: 0px;
      --scale: 1;
      --topbar-h: 56px; /* JS에서 보정 */
    }
    *{ box-sizing:border-box; }
    html,body{
      margin:0; height:100%; min-height:100vh; min-height:100dvh;
      background:var(--bg); color:var(--text);
      font-family:"Noto Sans KR",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      overscroll-behavior: none;
    }
    button{ cursor:pointer; }

    /* 레이아웃 */
    .app{ display:grid; grid-template-rows:auto auto 1fr; height:100%; min-height:100vh; min-height:100dvh; }
    .main{ position:relative; height:100%; min-height:0; overflow:hidden; }

    /* Top bar */
    .topbar{
      position:relative; display:grid; grid-template-columns: auto 1fr;
      gap:8px; align-items:center; padding:10px 12px; border-bottom:1px solid #20242b; background:#0b0e13aa; backdrop-filter: blur(6px);
    }
    .title{ text-align:var(--title-align); color:var(--title-color); font-weight:700; font-size:18px; letter-spacing:.2px; }
    .iconbtn{
      background:#1a1f27; border:1px solid #252b35; color:#d9e3f0; padding:8px 12px; border-radius:10px; min-width:44px; min-height:36px;
    }

    /* 상단 툴바: PC/모바일 공통 사용
       - 중앙: 줌/전체/캡처 묶음
       - 우측: 작성/이동/삭제 */
    .toolbar{
      display:flex; align-items:center; gap:12px;
      padding:8px 12px; border-bottom:1px solid #20242b; background:#0b0e13ee; backdrop-filter: blur(4px); z-index:60;
    }
    .toolbar .zoomwrap{ flex:1; display:flex; justify-content:center; }
    .toolbar .group{ display:flex; gap:8px; align-items:center; }
    .toolbar .btn{ background:#10151d; border:1px solid #293241; color:#dce7f5; padding:8px 10px; border-radius:10px; min-width:40px; }
    .toolbar input[type="range"]{ width: 180px; }
    @media (max-width: 420px){ .toolbar input[type="range"]{ width:120px; } }

    /* 리스트 패널 (고정) */
    .panel{
      position:fixed; top:var(--topbar-h); bottom:0; width:var(--panel-width);
      background:#0b0e13f2; border-right:1px solid #1f2430;
      transform: translateX(calc(var(--panel-x, -100%)));
      transition: transform .25s ease; overflow:auto; padding:12px;
      left:0; z-index:1000;
    }
    .panel.right{ left:auto; right:0; border-right:none; border-left:1px solid #1f2430; transform: translateX(calc(var(--panel-x, 100%))); }
    .panel.open{ --panel-x: 0%; }

    /* 리스트 테이블 */
    .panel h3{ margin:6px 0 8px; font-size:14px; color:#b7c2cf; }
    .table{ width:100%; border-collapse:collapse; font-size:13px; table-layout: fixed; }
    .table th, .table td{ border-bottom:1px solid #273040; padding:8px; text-align:left; vertical-align:top; }
    .table th{ color:#b7c2cf; font-weight:600; position:sticky; top:0; background:#0b0e13f2; }
    .table tr{ cursor:pointer; }
    .table td .ell{ display:block; white-space:normal; overflow:hidden; text-overflow:ellipsis; }
    .table td.name{ width:70px; word-break:break-word; }
    .table td.text{ width:auto; }
    .table td.act{ width:96px; }
    .table .rowbtn{ background:#10151d; border:1px solid #293241; color:#dce7f5; padding:6px 8px; border-radius:10px; min-width:44px; cursor:pointer; }

    /* 보드 */
    .board{
      position:absolute; inset:0; background-image: var(--board-image);
      background-position:center; background-size:cover; background-repeat:no-repeat; cursor: grab;
      touch-action: none; /* 제스처 직접 처리 */
    }
    .board.panning{ cursor: grabbing; }

    /* WORLD */
    .world{
      position:absolute; left:0; top:0;
      transform: translate(var(--cam-x), var(--cam-y)) scale(var(--scale));
      transform-origin: 0 0;
      width:30000px; height:30000px;
    }

    /* Note */
    .note{
      position:absolute; width:var(--note-size); height:var(--note-size);
      background-image: var(--postit-image); background-size: cover; background-position:center; background-repeat:no-repeat;
      border:none; padding:12px; color:#0b0f14; box-shadow: 0 8px 24px rgba(0,0,0,.28);
      display:flex; flex-direction:column; z-index:1;
    }
    .note .nick{ font-weight:700; color:#111; margin-top:6px; }
    .note .body{ margin-top:6px; color:#111; line-height:1.25; overflow:auto; white-space:pre-wrap; word-break:break-word; }

    .note.draft{ outline: 3px dashed #ff8c00; outline-offset: 0; z-index:9999 !important; }

    /* Draft UI */
    .nickInput{ background:transparent; border:none; outline:none; color:#111; font-weight:700; font-size:14px; padding:4px 6px; margin:8px 0 6px; }
    .nickInput::placeholder{ color:#00000066; }
    .textInput{ flex:1; background:transparent; border:none; outline:none; color:#111; resize:none; padding:6px; line-height:1.3; white-space:pre-wrap; }
    .textInput::placeholder{ color:#00000066; }

    .dragHandle{
      position:absolute; left:50%; top:-32px; transform:translateX(-50%);
      background:#ffffffcc; color:#111; border:2px dotted #111; border-radius:10px;
      padding:4px 10px; font-size:12px; user-select:none; cursor:grab; box-shadow: 0 4px 10px rgba(0,0,0,.12);
    }
    .dragHandle:active{ cursor:grabbing; }

    .ctrlBar{ position:absolute; left:0; right:0; bottom:-52px; display:flex; gap:8px; justify-content:center; }
    .ctrlBar button{ padding:8px 12px; border-radius:10px; border:2px dotted #111; background:#fff; color:#111; min-width:72px; font-weight:700; }
    .ctrlBar button.del{ background:#ffdfe0; }
    .ctrlBar button:disabled{ opacity:.6; cursor:not-allowed; }

    /* 폰트 크기 다이얼: 포스트잇 ‘좌측 변 옆’ */
    .fsDial{
      position:absolute; left:-72px; top:50%; transform:translateY(-50%);
      background:#ffffffcc; border:2px dotted #111; border-radius:12px; padding:6px; box-shadow: 0 4px 10px rgba(0,0,0,.12);
    }
    .fsDial input[type="range"]{ writing-mode: vertical-lr; direction: rtl; appearance: none; width: 28px; height: 140px; background:transparent; }
    .fsVal{ color:#111; font-size:12px; text-align:center; margin-top:4px; }

    /* 미니맵 */
    .minimap{
      position:absolute; left:12px; bottom:12px; width:160px; height:160px; background:#0b0e13cc; border:1px solid #293241; border-radius:12px; overflow:hidden; z-index:45;
      box-shadow:0 6px 16px rgba(0,0,0,.25);
    }
    .minimap canvas{ width:100%; height:100%; display:block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
</head>
<body>
  <div class="app">
    <div class="topbar" id="topbar">
      <button id="btnPanel" class="iconbtn" title="리스트">🗂️</button>
      <div class="title" id="title">온라인 포스트잇 게시판</div>
    </div>

    <!-- 상단 툴바: PC/모바일 공통 사용 -->
    <div class="toolbar" id="toolbar">
      <div class="zoomwrap">
        <!-- 중앙 묶음: [-][슬라이더][+][전체][캡처] -->
        <div class="group">
          <button id="zoomOutTop" class="btn" title="축소">−</button>
          <input id="zoomRangeTop" type="range" min="0.2" max="2.0" step="0.01" value="1" />
          <button id="zoomInTop" class="btn" title="확대">＋</button>
          <button id="fitAllTop" class="btn">⤢ 전체</button>
          <button id="capBoardTop" class="btn">📷 캡처</button>
        </div>
      </div>
      <!-- 우측 묶음: 작성/이동/삭제 (상태에 따라 토글) -->
      <div class="group" id="actions">
        <button id="btnNewTop" class="btn">＋ 새 포스트잇</button>
        <button id="btnGoTop"  class="btn" style="display:none;">⇢ 작성중 이동</button>
        <button id="btnDelTop" class="btn" style="display:none;background:#f87171;border-color:#f87171;">삭제</button>
      </div>
    </div>

    <div class="main" id="main">
      <div class="board" id="board">
        <div class="world" id="world"></div>
      </div>

      <!-- 미니맵 -->
      <div class="minimap" id="miniWrap"><canvas id="minimap"></canvas></div>
    </div>
  </div>

  <!-- 리스트 패널 -->
  <aside id="panel" class="panel">
    <h3>승인된 메모</h3>
    <table class="table">
      <thead>
        <tr><th class="name">닉네임</th><th class="text">내용</th><th class="act">작업</th></tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </aside>

  <script>
    /* ====== Config ====== */
    const API = 'https://script.google.com/macros/s/AKfycbwjEi0XJTMi4UfPhMi8CQnw_rT-QNakzDhOMhwRPfk8b7WQcKByEzn6_OdT2pplGam4hg/exec'; // ← 본인 Apps Script /exec URL
    const NOTE = { W: 280, H: 280 };
    const WORLD = { W: 30000, H: 30000 };
    const CAMERA = { x: 0, y: 0, scale: 1, min: .2, max: 2 };

    /* ====== State ====== */
    const state = {
      owner: getOrSetOwner_(),
      settings: null,
      notes: [],
      draft: loadDraft_(),
      panelOpen: false,
      panelDock: 'left',
      isPanning: false,
      panPrev: null,
      topZ: 10,
      zMap: {},
      lastTapTime: 0, lastTapPos: {x:0,y:0}
    };

    const $root = document.documentElement;
    const $title = document.getElementById('title');
    const $panel = document.getElementById('panel');
    const $topbar = document.getElementById('topbar');
    const $listBody  = document.getElementById('list');
    const $world = document.getElementById('world');
    const $board = document.getElementById('board');

    // 툴바 컨트롤
    const $zoomRangeTop = document.getElementById('zoomRangeTop');
    const $btnNewTop = document.getElementById('btnNewTop');
    const $btnGoTop  = document.getElementById('btnGoTop');
    const $btnDelTop = document.getElementById('btnDelTop');

    // 미니맵
    const $miniWrap = document.getElementById('miniWrap');
    const $minimap = document.getElementById('minimap');
    const mm = { dragging:false };

    // 관성(가속) 이동 상태 + 드래그 스무딩(RAF)
    const inertia = { raf:0, vx:0, vy:0 };
    const pan = { raf:0, dx:0, dy:0, lastVX:0, lastVY:0, lastT:0 };
    function stopInertia(){ if (inertia.raf){ cancelAnimationFrame(inertia.raf); inertia.raf=0; } inertia.vx=0; inertia.vy=0; }

    /* ====== Boot ====== */
    (async function init(){
      recalcTopbarHeight_();
      await bootstrap();
      bindUI();
      renderAll();
      fitAll();
      updateToolbarActions();
      window.addEventListener('resize', onResize);
    })();

    function onResize(){
      recalcTopbarHeight_();
      updateMinimap();
      stopInertia();
    }

    function recalcTopbarHeight_(){
      const h = $topbar.getBoundingClientRect().height + document.getElementById('toolbar').getBoundingClientRect().height;
      $root.style.setProperty('--topbar-h', h + 'px');
    }

    async function bootstrap(){
      const url = `${API}?action=bootstrap&owner=${encodeURIComponent(state.owner)}`;
      const j = await (await fetch(url)).json();
      if (!j.ok) throw new Error('bootstrap failed');

      const s = j.settings.values;
      state.settings = j.settings;

      $title.textContent = toStr(s.screenTitle || '온라인 포스트잇 게시판');
      document.title = toStr(s.pageTitle || $title.textContent);
      setVar('--title-align', s.titleAlign || 'center');
      setVar('--bg', s.bgColor || '#0f1115');

      const ns = parseInt(s.noteSizePx || '280', 10);
      NOTE.W = NOTE.H = ns; setVar('--note-size', ns+'px');

      CAMERA.min = parseFloat(s.zoomMin || '0.2') || .2;
      CAMERA.max = parseFloat(s.zoomMax || '2.0') || 2;
      CAMERA.scale = parseFloat(s.zoomDefault || '1.0') || 1;

      // 슬라이더 동기화
      $zoomRangeTop.min = CAMERA.min; $zoomRangeTop.max = CAMERA.max; $zoomRangeTop.value = CAMERA.scale;

      if (j.settings.assets && j.settings.assets.bg) setVar('--board-image', `url(${j.settings.assets.bg})`);
      if (j.settings.assets && j.settings.assets.postit) setVar('--postit-image', `url(${j.settings.assets.postit})`);

      const dock = (s.panelDock || 'left');
      state.panelDock = dock;
      $panel.classList.toggle('right', dock === 'right');

      setVar('--panel-width', (parseInt(s.panelWidthPx||'320',10)||320) + 'px');

      state.notes = (j.data || []).map(sanitizeNote);

      if (state.draft) saveDraft_(Object.assign({}, state.draft));

      updateCamera(0, 0, CAMERA.scale);
      updateMinimap();
    }

    /* ====== UI ====== */
    function bindUI(){
      document.getElementById('btnPanel').onclick = togglePanel;

      // 상단 툴바 (줌/전체/캡처)
      document.getElementById('zoomInTop').onclick  = () => setZoomAtCenter(CAMERA.scale * 1.1);
      document.getElementById('zoomOutTop').onclick = () => setZoomAtCenter(CAMERA.scale / 1.1);
      $zoomRangeTop.oninput = e => setZoomAtCenter(parseFloat(e.target.value));
      document.getElementById('fitAllTop').onclick = fitAll;
      document.getElementById('capBoardTop').onclick = () => captureElem($board, 'board.png');

      // 상단 툴바 (작성/이동/삭제)
      $btnNewTop.onclick = () => {
        if (state.draft) { centerOnDraft(1.0); return; }
        const wc = worldCenter();
        createDraftAt({x: wc.x - NOTE.W/2, y: wc.y - NOTE.H/2}, true);
      };
      $btnDelTop.onclick = clearDraft;
      $btnGoTop.onclick  = () => centerOnDraft(1.0);

      // 보드 상호작용
      $board.addEventListener('pointerdown', onPointerDown, {passive:false});
      $board.addEventListener('pointermove', onPointerMove,  {passive:false});
      $board.addEventListener('pointerup',   onPointerUp,    {passive:false});
      $board.addEventListener('pointercancel', onPointerUp,  {passive:false});
      $board.addEventListener('wheel', onWheelPanZoom, {passive:false});

      // 더블클릭(PC)으로 새 메모
      $board.addEventListener('dblclick', (e)=>{
        if (state.draft) { centerOnDraft(1.0); return; }
        const p = toWorld(e.clientX, e.clientY);
        createDraftAt({x:p.x - NOTE.W/2, y:p.y - NOTE.H/2}, true);
      });

      // 키보드 네비게이션
      document.addEventListener('keydown', (e) => {
        const ae = document.activeElement;
        const isEditing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable);
        if (isEditing) return;
        if (e.key === 'Escape' && state.panelOpen) togglePanel();
        if (e.key === 'ArrowLeft')  { CAMERA.x += 80; setCamVars_(); }
        if (e.key === 'ArrowRight') { CAMERA.x -= 80; setCamVars_(); }
        if (e.key === 'ArrowUp')    { CAMERA.y += 80; setCamVars_(); }
        if (e.key === 'ArrowDown')  { CAMERA.y -= 80; setCamVars_(); }
      });

      // 미니맵 상호작용
      $miniWrap.addEventListener('pointerdown', (e) => { mm.dragging = true; goMinimap(e); e.preventDefault(); });
      $miniWrap.addEventListener('pointermove', (e) => { if (mm.dragging) { goMinimap(e); e.preventDefault(); } });
      const mmEnd = () => { mm.dragging = false; };
      $miniWrap.addEventListener('pointerup', mmEnd);
      $miniWrap.addEventListener('pointercancel', mmEnd);
    }

    function togglePanel(){
      state.panelOpen = !state.panelOpen;
      $panel.classList.toggle('open', state.panelOpen);
    }

    async function refreshList(){
      const url = `${API}?action=list&owner=${encodeURIComponent(state.owner)}`;
      const j = await (await fetch(url)).json();
      if (j.ok) { state.notes = (j.data || []).map(sanitizeNote); renderAll(); }
    }

    /* ====== Rendering ====== */
    function renderAll(){ renderNotes(); renderList(); updateToolbarActions(); updateMinimap(); }

    function renderNotes(){
      $world.innerHTML = '';

      let maxZ = state.topZ;
      for (const n of state.notes) { if (state.zMap[n.id]) maxZ = Math.max(maxZ, state.zMap[n.id]); }
      state.topZ = Math.max(maxZ, 10);

      for (const n of state.notes) {
        const el = document.createElement('div');
        el.className = 'note';
        el.dataset.id = n.id || '';
        const nx = clamp(n.x || 0, 0, Math.max(0, WORLD.W - NOTE.W));
        const ny = clamp(n.y || 0, 0, Math.max(0, WORLD.H - NOTE.H));
        el.style.left = nx + 'px';
        el.style.top  = ny + 'px';
        el.style.width = NOTE.W+'px';
        el.style.height = NOTE.H+'px';
        if (state.zMap[n.id]) el.style.zIndex = state.zMap[n.id];

        el.innerHTML = `
          <div class="nick">${escapeHtml(toStr(n.nick || '익명'))}${n.status==='submitted'?' <small style="color:#555">· 승인대기</small>':''}</div>
          <div class="body" style="font-size:${(n.fs||14)}pt">${escapeHtml(toStr(n.text))}</div>
        `;

        el.addEventListener('click', () => bringToFrontEl(el));
        el.addEventListener('dblclick', () => focusNote(n));

        $world.appendChild(el);
      }

      // Draft
      if (state.draft) {
        const d = state.draft;
        clampDraftToWorld_(d);
        const el = document.createElement('div');
        el.className = 'note draft';
        el.style.left = (d.x || 0) + 'px';
        el.style.top  = (d.y || 0) + 'px';
        el.style.width = NOTE.W+'px';
        el.style.height = NOTE.H+'px';
        el.innerHTML = `
          <div class="dragHandle">드래그 하여 이동</div>
          <input id="dNick" class="nickInput" maxlength="12" placeholder="닉네임(최대 12자)" value="${escapeAttr(toStr(d.nick||''))}">
          <textarea id="dText" class="textInput" placeholder="내용을 입력하세요 (제출 후 수정/삭제 불가)" style="font-size:${(d.fs||16)}pt">${escapeText(toStr(d.text||''))}</textarea>
          <div class="fsDial">
            <input id="dFs" type="range" min="10" max="48" step="1" value="${d.fs||16}">
            <div class="fsVal">${d.fs||16}pt</div>
          </div>
          <div class="ctrlBar">
            <button id="dSubmit">제출</button>
            <button id="dDelete" class="del">삭제</button>
          </div>
        `;

        enableDrag(el, (dx, dy) => {
          d.x = (d.x||0) + dx / CAMERA.scale;
          d.y = (d.y||0) + dy / CAMERA.scale;
          clampDraftToWorld_(d);
          saveDraft_(d);
          el.style.left = d.x + 'px';
          el.style.top  = d.y + 'px';
        }, '.dragHandle');

        wireDraftForm_(el, d);
        $world.appendChild(el);
      }
    }

    function renderList(){
      const items = state.notes
        .filter(n => String(n.status).toLowerCase()==='approved')
        .sort((a,b)=> (+new Date(a.ts||a.tsKR)) - (+new Date(b.ts||b.tsKR)));
      $listBody.innerHTML = '';
      for (const n of items) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="name">${escapeHtml(toStr(n.nick||'익명'))}</td>
          <td class="text"><span class="ell">${escapeHtml(toStr(n.text))}</span></td>
          <td class="act">
            <button class="rowbtn btn-move" style="margin-right:6px;">이동</button>
            <button class="rowbtn btn-cap">캡쳐</button>
          </td>
        `;
        tr.addEventListener('click', (e) => { if (e.target.closest('button')) return; moveToNote(n); });
        tr.querySelector('.btn-move').onclick = () => moveToNote(n);
        tr.querySelector('.btn-cap').onclick  = async () => {
          const node = findNoteElById(n.id);
          if (node) await captureElem(node, `note-${(n.id||'')}.png`);
        };
        $listBody.appendChild(tr);
      }
    }

    function updateToolbarActions(){
      const hasDraft = !!state.draft;
      $btnNewTop.style.display = hasDraft ? 'none' : '';
      $btnGoTop.style.display  = hasDraft ? '' : 'none';
      $btnDelTop.style.display = hasDraft ? '' : 'none';
    }

    function safeEscapeCss(s){ if (window.CSS && CSS.escape) return CSS.escape(String(s)); return String(s).replace(/[^a-zA-Z0-9_-]/g, '\\$&'); }
    function findNoteElById(id){ return $world.querySelector(`.note[data-id="${safeEscapeCss(id||'')}"]`); }

    function bringToFrontEl(el){
      state.topZ += 1;
      const id = el.dataset.id || '';
      state.zMap[id] = state.topZ;
      el.style.zIndex = state.topZ;
    }
    function bringToFrontById(id){ const el = findNoteElById(id); if (el) bringToFrontEl(el); }

    function moveToNote(n){
      if (CAMERA.scale < 0.85 || CAMERA.scale > 1.2) setZoomAtCenter(1.0);
      const center = { x: clamp((n.x||0)+NOTE.W/2, 0, WORLD.W), y: clamp((n.y||0)+NOTE.H/2, 0, WORLD.H) };
      focusWorldPoint(center);
      bringToFrontById(n.id);
    }
    function focusNote(n){
      const center = { x: clamp((n.x||0)+NOTE.W/2, 0, WORLD.W), y: clamp((n.y||0)+NOTE.H/2, 0, WORLD.H) };
      focusWorldPoint(center);
      if (!state.panelOpen) togglePanel();
    }
    function goToDraft(){ centerOnDraft(1.0); }

    function fitAll(){
      const rects = [];
      for (const n of state.notes) rects.push({x:clamp(n.x||0,0,Math.max(0,WORLD.W-NOTE.W)), y:clamp(n.y||0,0,Math.max(0,WORLD.H-NOTE.H)), w:NOTE.W,h:NOTE.H});
      if (state.draft) rects.push({x:clamp(state.draft.x||0,0,Math.max(0,WORLD.W-NOTE.W)), y:clamp(state.draft.y||0,0,Math.max(0,WORLD.H-NOTE.H)), w:NOTE.W,h:NOTE.H});
      if (!rects.length) { setZoomAtCenter(CAMERA.scale); return; }

      const bb = boundsOf(rects);
      const pad = 80;
      const vw = $board.clientWidth - pad*2;
      const vh = $board.clientHeight - pad*2;
      const s1 = vw / (bb.w||1);
      const s2 = vh / (bb.h||1);
      const s = clamp(Math.min(s1, s2), CAMERA.min, CAMERA.max);
      setZoomAtCenter(s);

      const center = { x: bb.x + bb.w/2, y: bb.y + bb.h/2 };
      focusWorldPoint(center, false);
    }

    /* ====== Draft ====== */
    function wireDraftForm_(root, d){
      const $nick = root.querySelector('#dNick');
      const $text = root.querySelector('#dText');
      const $fs   = root.querySelector('#dFs');
      const $submit = root.querySelector('#dSubmit');
      const $del    = root.querySelector('#dDelete');
      const $fsVal  = root.querySelector('.fsVal');

      const sync = () => {
        d.nick = $nick.value.trim();
        d.text = $text.value;
        d.fs = parseInt($fs.value,10)||16;
        $fsVal.textContent = d.fs+'pt';
        $text.style.fontSize = d.fs+'pt';
        saveDraft_(d);
      };

      $nick.oninput = sync; $text.oninput = sync; $fs.oninput = sync;

      $submit.onclick = async () => {
        if (!d.nick) { d.nick = '익명'; $nick.value = '익명'; }
        if (!d.text) { alert('내용을 입력하세요.'); return; }
        if (!confirm('이 내용으로 제출하시겠습니까? 제출 후에는 수정/삭제가 불가합니다.')) return;

        $submit.disabled = true; $del.disabled = true; $submit.textContent = '제출 중…';

        const x = Math.round(clamp(d.x||0, 0, Math.max(0, WORLD.W - NOTE.W)));
        const y = Math.round(clamp(d.y||0, 0, Math.max(0, WORLD.H - NOTE.H)));

        const fd = new URLSearchParams();
        fd.set('action','create');
        fd.set('owner', state.owner);
        fd.set('nick', d.nick);
        fd.set('text', d.text);
        fd.set('x', x);
        fd.set('y', y);
        fd.set('fs', d.fs||16);

        try{
          const res = await fetch(API, { method:'POST', body: fd });
          const j = await res.json();
          if (!j.ok) {
            alert(j.error || '제출 실패');
            $submit.disabled=false; $del.disabled=false; $submit.textContent='제출';
            return;
          }
          // ✅ 성공 시: 알림창 없이, 화면에 그대로 "승인대기" 상태로 전환
          const newNote = {
            id: j.id, owner: state.owner, nick: d.nick, text: d.text,
            status: 'submitted', ts: j.ts, tsKR: j.tsKR,
            x, y, fs: d.fs||16
          };
          state.notes.push(sanitizeNote(newNote));
          // 드래프트 제거 & 재렌더
          state.draft = null; localStorage.removeItem('mn_draft');
          renderAll();
          // 최신 서버 상태 동기화(백그라운드)
          refreshList();
        }catch(err){
          alert('네트워크 오류로 제출에 실패했습니다.');
          $submit.disabled=false; $del.disabled=false; $submit.textContent='제출';
        }
      };

      $del.onclick = clearDraft;
    }

    function createDraftAt(pos, zoomToCenter=false){
      if (state.draft) { centerOnDraft(1.0); return; }
      const d = { nick:'', text:'', x: clamp(Math.round(pos.x||0), 0, Math.max(0, WORLD.W - NOTE.W)), y: clamp(Math.round(pos.y||0), 0, Math.max(0, WORLD.H - NOTE.H)), fs: 16 };
      state.draft = d;
      saveDraft_(state.draft);
      renderAll();
      if (zoomToCenter) centerOnDraft(1.0);
    }

    function centerOnDraft(scale=1.0){
      if (!state.draft) { alert('작성 중인 메모가 없습니다.'); return; }
      const d = state.draft;
      const center = { x: (d.x||0) + NOTE.W/2, y: (d.y||0) + NOTE.H/2 };
      setZoomAtPoint(scale, $board.getBoundingClientRect().left + $board.clientWidth/2, $board.getBoundingClientRect().top + $board.clientHeight/2);
      focusWorldPoint(center);
    }

    function clearDraft(){ state.draft = null; localStorage.removeItem('mn_draft'); renderAll(); updateToolbarActions(); }
    function saveDraft_(d){ localStorage.setItem('mn_draft', JSON.stringify(d)); updateToolbarActions(); }
    function loadDraft_(){ try{ return JSON.parse(localStorage.getItem('mn_draft')||'null'); }catch(e){ return null; } }

    /* ====== Camera & Geometry ====== */
    function toWorld(cx, cy){
      const r = $board.getBoundingClientRect();
      const sx = cx - r.left, sy = cy - r.top;
      return { x: (sx - CAMERA.x) / CAMERA.scale, y: (sy - CAMERA.y) / CAMERA.scale };
    }
    function worldCenter(){
      const r = $board.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      return toWorld(cx, cy);
    }
    function focusWorldPoint(p){
      const r = $board.getBoundingClientRect();
      const cx = r.width / 2, cy = r.height / 2;
      CAMERA.x = cx - p.x * CAMERA.scale;
      CAMERA.y = cy - p.y * CAMERA.scale;
      setCamVars_();
    }
    function setZoomAtCenter(newScale){
      const r = $board.getBoundingClientRect();
      setZoomAtPoint(newScale, r.left + r.width/2, r.top + r.height/2);
    }
    function setZoomAtPoint(newScale, cx, cy){
      const ns = clamp(newScale, CAMERA.min, CAMERA.max);
      const before = CAMERA.scale;
      const r = $board.getBoundingClientRect();
      const sx = cx - r.left, sy = cy - r.top;
      const wx = (sx - CAMERA.x) / before, wy = (sy - CAMERA.y) / before;
      CAMERA.scale = ns;
      CAMERA.x = sx - wx * CAMERA.scale;
      CAMERA.y = sy - wy * CAMERA.scale;
      $zoomRangeTop.value = CAMERA.scale;
      setCamVars_();
    }
    function updateCamera(x,y,scale){ CAMERA.x = x; CAMERA.y = y; CAMERA.scale = scale; $zoomRangeTop.value = CAMERA.scale; setCamVars_(); }
    function setCamVars_(){ setVar('--scale', CAMERA.scale); setVar('--cam-x', CAMERA.x+'px'); setVar('--cam-y', CAMERA.y+'px'); updateMinimap(); }
    function boundsOf(rects){
      const xs = rects.map(r=>r.x), ys = rects.map(r=>r.y);
      const xe = rects.map(r=>r.x+r.w), ye = rects.map(r=>r.y+r.h);
      const minx = Math.min(...xs), miny = Math.min(...ys);
      const maxx = Math.max(...xe), maxy = Math.max(...ye);
      return { x:minx, y:miny, w:maxx-minx, h:maxy-miny };
    }

    /* ====== Pan / Wheel / Pinch + 더블탭 + PC 스무딩/관성 ====== */
    const pointers = new Map(); // id -> {x,y,t}
    const pinch = { active:false, lastDist:0, lastMid:{x:0,y:0} };

    function startInertia(vx, vy){
      stopInertia();
      inertia.vx = vx; inertia.vy = vy;
      let last = performance.now();
      const tick = (now)=>{
        const dt = now - last; last = now;
        CAMERA.x += inertia.vx * dt;
        CAMERA.y += inertia.vy * dt;
        setCamVars_();
        const damping = Math.pow(0.94, dt / 16); // 감쇠 조금 더 강하게 -> PC에서 부드럽게
        inertia.vx *= damping; inertia.vy *= damping;
        if (Math.hypot(inertia.vx, inertia.vy) < 0.02) { stopInertia(); return; }
        inertia.raf = requestAnimationFrame(tick);
      };
      inertia.raf = requestAnimationFrame(tick);
    }

    function schedulePanApply(){
      if (pan.raf) return;
      pan.raf = requestAnimationFrame(()=>{
        CAMERA.x += pan.dx; CAMERA.y += pan.dy;
        pan.dx = pan.dy = 0;
        setCamVars_();
        pan.raf = 0;
      });
    }

    function onPointerDown(ev){
      // 더블탭(모바일)로 새 메모
      if (ev.pointerType === 'touch' && !ev.target.closest('input,textarea,button,select,.panel,.dragHandle,.ctrlBar,.fsDial')){
        const now = performance.now();
        const isNear = Math.hypot(ev.clientX - state.lastTapPos.x, ev.clientY - state.lastTapPos.y) < 30;
        if (now - state.lastTapTime < 300 && isNear) {
          if (state.draft) { centerOnDraft(1.0); }
          else {
            const p = toWorld(ev.clientX, ev.clientY);
            createDraftAt({x:p.x - NOTE.W/2, y:p.y - NOTE.H/2}, true);
          }
          state.lastTapTime = 0; // consume
          ev.preventDefault();
          return;
        }
        state.lastTapTime = now;
        state.lastTapPos = {x: ev.clientX, y: ev.clientY};
      }

      if (ev.target.closest('input, textarea, button, select, .panel, .dragHandle, .ctrlBar, .fsDial')) return;

      stopInertia();
      $board.setPointerCapture(ev.pointerId);
      pointers.set(ev.pointerId, {x: ev.clientX, y: ev.clientY, t: performance.now()});

      if (pointers.size === 2){
        pinch.active = true;
        const [a,b] = [...pointers.values()];
        pinch.lastDist = Math.hypot(b.x - a.x, b.y - a.y);
        pinch.lastMid  = { x:(a.x+b.x)/2, y:(a.y+b.y)/2 };
      } else if (pointers.size === 1){
        pan.lastT = performance.now();
        $board.classList.add('panning');
      }

      ev.preventDefault();
    }

    function onPointerMove(ev){
      if (!pointers.has(ev.pointerId)) return;
      pointers.set(ev.pointerId, {x: ev.clientX, y: ev.clientY, t: performance.now()});

      if (pinch.active && pointers.size >= 2){
        const [a,b] = [...pointers.values()];
        const dist = Math.hypot(b.x - a.x, b.y - a.y);
        const mid  = { x:(a.x+b.x)/2, y:(a.y+b.y)/2 };
        if (pinch.lastDist > 0){
          const factor = dist / pinch.lastDist;
          setZoomAtPoint(CAMERA.scale * factor, mid.x, mid.y);
        }
        pinch.lastDist = dist; pinch.lastMid  = mid;
        ev.preventDefault(); return;
      }

      if (pointers.size === 1){
        const now = performance.now();
        const dt = Math.max(1, now - pan.lastT);
        const prev = state.panPrev || {x: ev.clientX, y: ev.clientY};
        const dx = ev.clientX - prev.x;
        const dy = ev.clientY - prev.y;

        // 누적(프레임 스무딩)
        pan.dx += dx; pan.dy += dy;
        schedulePanApply();

        // 최근 속도(평균) 갱신
        const alpha = 0.35; // EMA로 부드럽게
        const vx = dx / dt, vy = dy / dt;
        pan.lastVX = alpha * vx + (1-alpha) * pan.lastVX;
        pan.lastVY = alpha * vy + (1-alpha) * pan.lastVY;

        state.panPrev = {x: ev.clientX, y: ev.clientY};
        pan.lastT = now;
        ev.preventDefault();
      }
    }

    function onPointerUp(ev){
      const wasDragging = (pointers.size === 1);
      pointers.delete(ev.pointerId);
      if (pointers.size < 2) { pinch.active = false; pinch.lastDist = 0; }
      if (pointers.size === 0){
        $board.classList.remove('panning');
        state.panPrev = null;
        // 관성 시작 (PC에서 부드럽게)
        const speed = Math.hypot(pan.lastVX, pan.lastVY);
        if (wasDragging && speed > 0.02) startInertia(pan.lastVX, pan.lastVY);
        pan.lastVX = pan.lastVY = 0;
      }
    }

    function onWheelPanZoom(e){
      if (e.target.closest('input, textarea, button, select, .panel, .dragHandle, .ctrlBar, .fsDial')) return;
      e.preventDefault();
      stopInertia();
      if (e.ctrlKey) {
        const factor = Math.exp(-e.deltaY * 0.0015);
        setZoomAtPoint(CAMERA.scale * factor, e.clientX, e.clientY);
      } else {
        const k = 1;
        let dx = e.deltaX, dy = e.deltaY;
        if (Math.abs(dx) < 1 && e.shiftKey) dx = dy;
        CAMERA.x -= dx * k; CAMERA.y -= dy * k;
        setCamVars_();
      }
    }

    /* ====== Minimap ====== */
    function updateMinimap(){
      const ctx = $minimap.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const cssW = $miniWrap.clientWidth || 160, cssH = $miniWrap.clientHeight || 160;
      $minimap.width = Math.round(cssW * dpr);
      $minimap.height = Math.round(cssH * dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);

      // 배경
      ctx.clearRect(0,0, cssW, cssH);
      ctx.fillStyle = '#0b0e13'; ctx.fillRect(0,0, cssW, cssH);
      ctx.strokeStyle = '#293241'; ctx.strokeRect(0.5,0.5, cssW-1, cssH-1);

      const sx = cssW / WORLD.W, sy = cssH / WORLD.H, s = Math.min(sx, sy);

      // 노트 점
      ctx.fillStyle = '#9ab6ff';
      const dot = Math.max(2, Math.round(NOTE.W * s * 0.5));
      for (const n of state.notes){
        const nx = clamp(n.x||0, 0, WORLD.W - NOTE.W);
        const ny = clamp(n.y||0, 0, WORLD.H - NOTE.H);
        ctx.fillRect(Math.round(nx*s), Math.round(ny*s), dot, dot);
      }
      // 드래프트
      if (state.draft){
        const dx = clamp(state.draft.x||0, 0, WORLD.W - NOTE.W);
        const dy = clamp(state.draft.y||0, 0, WORLD.H - NOTE.H);
        ctx.fillStyle = '#ffb86b';
        ctx.fillRect(Math.round(dx*s), Math.round(dy*s), dot, dot);
      }

      // 뷰포트
      const r = $board.getBoundingClientRect();
      const wx = -CAMERA.x / CAMERA.scale, wy = -CAMERA.y / CAMERA.scale;
      const ww = r.width / CAMERA.scale, wh = r.height / CAMERA.scale;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
      ctx.strokeRect(Math.round(wx*s)+0.5, Math.round(wy*s)+0.5, Math.max(10, ww*s), Math.max(10, wh*s));
    }

    function goMinimap(e){
      const rect = $miniWrap.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      const cssW = rect.width, cssH = rect.height;
      const sx = cssW / WORLD.W, sy = cssH / WORLD.H, s = Math.min(sx, sy);
      const wx = x / s, wy = y / s;
      focusWorldPoint({ x: wx, y: wy });
    }

    /* ====== Capture ====== */
    async function captureElem(el, filename){
      try{
        if (!window.html2canvas) throw new Error('no html2canvas');
        const canvas = await html2canvas(el, {backgroundColor: null, useCORS: true, scale: 2});
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png'); a.download = filename || 'capture.png'; a.click();
      } catch (e) { window.print(); }
    }

    /* ====== Utils ====== */
    function setVar(k, v){ document.documentElement.style.setProperty(k, v); }
    function toStr(v){ return v == null ? '' : (typeof v === 'string' ? v : String(v)); }
    function getOrSetOwner_(){ let id = localStorage.getItem('mn_owner'); if (!id) { id = cryptoRandomId_(); localStorage.setItem('mn_owner', id); } return id; }
    function cryptoRandomId_(){ const a = new Uint8Array(16); crypto.getRandomValues(a); return [...a].map(x=>x.toString(16).padStart(2,'0')).join(''); }
    function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
    function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    function escapeAttr(s){ return String(s).replace(/"/g, '&quot;'); }
    function escapeText(s){ return String(s).replace(/</g, '&lt;'); }

    function sanitizeNote(n){
      return {
        ...n,
        nick: toStr(n.nick),
        text: toStr(n.text),
        tsKR: toStr(n.tsKR),
        ts: toStr(n.ts),
        status: (n.status||'').toString().toLowerCase(),
        x: clamp(Number(n.x)||0, 0, Math.max(0, WORLD.W - NOTE.W)),
        y: clamp(Number(n.y)||0, 0, Math.max(0, WORLD.H - NOTE.H)),
        fs: Number(n.fs) || 16
      };
    }

    function clampDraftToWorld_(d){
      d.x = clamp(Number(d.x)||0, 0, Math.max(0, WORLD.W - NOTE.W));
      d.y = clamp(Number(d.y)||0, 0, Math.max(0, WORLD.H - NOTE.H));
    }

    function enableDrag(el, ondrag, handleSelector){
      const handle = handleSelector ? el.querySelector(handleSelector) : el;
      let prev = null;
      handle.addEventListener('pointerdown', (ev)=>{
        prev = {x:ev.clientX, y:ev.clientY};
        handle.setPointerCapture(ev.pointerId);
        ev.stopPropagation();
      });
      handle.addEventListener('pointermove', (ev)=>{
        if (!prev) return;
        const dx = ev.clientX - prev.x, dy = ev.clientY - prev.y;
        prev = {x:ev.clientX, y:ev.clientY};
        ondrag(dx, dy);
      });
      const end = ()=> { prev=null; };
      handle.addEventListener('pointerup', end);
      handle.addEventListener('pointercancel', end);
    }
  </script>
</body>
