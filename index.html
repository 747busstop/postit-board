<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>온라인 포스트잇 게시판</title>
  <style>
    :root{
      --bg:#0f1115;
      --text:#e8eaed;
      --title-color:#ffffff;
      --title-align:center;
      --postit-image:none;
      --board-image:none;
      --note-size: 280px;
      --panel-width: 320px;
      --cam-x: 0px;
      --cam-y: 0px;
      --scale: 1;
    }
    *{ box-sizing:border-box; }
    html,body{ margin:0; height:100%; background:var(--bg); color:var(--text); font-family:"Noto Sans KR",system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    button{ cursor:pointer; }

    .app{ display:grid; grid-template-rows:auto 1fr; height:100%; }

    /* Top bar */
    .topbar{
      position:relative; display:grid; grid-template-columns: auto 1fr auto;
      gap:8px; align-items:center; padding:10px 12px; border-bottom:1px solid #20242b; background:#0b0e13aa; backdrop-filter: blur(6px);
    }
    .title{ text-align:var(--title-align); color:var(--title-color); font-weight:700; font-size:18px; letter-spacing:.2px; }
    .iconbtn{
      background:#1a1f27; border:1px solid #252b35; color:#d9e3f0; padding:8px 12px; border-radius:10px; min-width:44px; min-height:36px;
    }

    /* ====== NEW: 메인 레이아웃을 그리드로 전환 - 패널이 보드를 '밀어내는' 방식 ====== */
    .main{
      position:relative; height:100%;
      display:grid; grid-template-columns: 0 1fr; grid-template-rows: 1fr;
      transition: grid-template-columns .25s ease;
    }
    .main.dock-right{ grid-template-columns: 1fr 0; }
    .main.open{ grid-template-columns: var(--panel-width) 1fr; }
    .main.open.dock-right{ grid-template-columns: 1fr var(--panel-width); }

    /* 패널(그리드 아이템) */
    .panel{
      width:100%; height:100%; overflow:auto; padding:12px;
      background:#0b0e13f2; border-right:1px solid #1f2430;
    }
    .main.dock-right .panel{ border-right:none; border-left:1px solid #1f2430; }

    /* 리스트 테이블 */
    .panel h3{ margin:6px 0 8px; font-size:14px; color:#b7c2cf; }
    .table{ width:100%; border-collapse:collapse; font-size:13px; table-layout: fixed; }
    .table th, .table td{ border-bottom:1px solid #273040; padding:8px; text-align:left; vertical-align:top; }
    .table th{ color:#b7c2cf; font-weight:600; position:sticky; top:0; background:#0b0e13f2; }
    .table td .ell{ display:block; white-space:normal; overflow:hidden; text-overflow:ellipsis; }
    .table td.name{ width:70px; word-break:break-word; }
    .table td.text{ width:auto; }
    .table td.act{ width:96px; }
    .table tr{ cursor:pointer; }
    .table .rowbtn{ background:#10151d; border:1px solid #293241; color:#dce7f5; padding:6px 8px; border-radius:10px; min-width:44px; cursor:pointer; }

    /* Board(그리드 아이템) */
    .board{
      position:relative; width:100%; height:100%;
      background-image: var(--board-image);
      background-position:center; background-size:cover; background-repeat:no-repeat;
      cursor: grab;
    }
    .board.panning{ cursor: grabbing; }

    /* TOP-LEFT ORIGIN world */
    .world{
      position:absolute; left:0; top:0;
      transform: translate(var(--cam-x), var(--cam-y)) scale(var(--scale));
      transform-origin: 0 0;
      width:30000px; height:30000px;
    }

    /* Note (승인/보기용) */
    .note{
      position:absolute; width:var(--note-size); height:var(--note-size);
      background-image: var(--postit-image);
      background-size: cover; background-position:center; background-repeat:no-repeat;
      border:none; padding:12px; color:#0b0f14;
      box-shadow: 0 8px 24px rgba(0,0,0,.28);
      display:flex; flex-direction:column;
    }
    .note .nick{ font-weight:700; color:#111; margin-top:6px; }
    .note .body{
      margin-top:6px; color:#111; line-height:1.25;
      overflow:auto; white-space:pre-wrap; word-break:break-word;
    }
    .note.draft{ outline: 3px dashed #ff8c00; outline-offset: 0; }

    /* Draft 내부 입력(투명) */
    .nickInput{ background:transparent; border:none; outline:none; color:#111; font-weight:700; font-size:14px; padding:4px 6px; margin:8px 0 6px; }
    .nickInput::placeholder{ color:#00000066; }
    .textInput{ flex:1; background:transparent; border:none; outline:none; color:#111; resize:none; padding:6px; line-height:1.3; white-space:pre-wrap; }
    .textInput::placeholder{ color:#00000066; }

    /* 드래그 핸들/버튼/슬라이더: 포스트잇 밖으로 */
    .dragHandle{
      position:absolute; left:50%; top:-32px; transform:translateX(-50%);
      background:#ffffffcc; color:#111; border:1px dashed #9aa4b2; border-radius:10px;
      padding:4px 10px; font-size:12px; user-select:none; cursor:grab;
      box-shadow: 0 4px 10px rgba(0,0,0,.12);
    }
    .dragHandle:active{ cursor:grabbing; }
    .ctrlBar{ position:absolute; left:0; right:0; bottom:-46px; display:flex; gap:8px; justify-content:center; }
    .ctrlBar button{ padding:8px 12px; border-radius:10px; border:1px solid #e5e7eb; background:#fff; color:#111; min-width:72px; }
    .ctrlBar button.del{ background:#ffe8e8; border-color:#f3b6b6; }
    .ctrlBar button:disabled{ opacity:.6; cursor:not-allowed; }
    .fsDial{
      position:absolute; right:-48px; top:50%; transform:translateY(-50%);
      background:#ffffffcc; border:1px solid #e5e7eb; border-radius:12px; padding:6px;
      box-shadow: 0 4px 10px rgba(0,0,0,.12);
    }
    .fsDial input[type="range"]{ writing-mode: bt-lr; -webkit-appearance: slider-vertical; width: 28px; height: 140px; background:transparent; }
    .fsVal{ color:#111; font-size:12px; text-align:center; margin-top:4px; }

    /* 우측 도구/FAB(보드 내부 절대배치) */
    .tools{
      position:absolute; right:12px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:8px; z-index:15;
    }
    .zoomdock{ background:#10151d; border:1px solid #293241; padding:10px; border-radius:16px; display:flex; flex-direction:column; align-items:center; gap:8px; }
    .square{ width:48px; height:48px; display:inline-grid; place-items:center; border-radius:12px; background:#10151d; border:1px solid #293241; color:#dce7f5; }
    .square:active{ transform:scale(0.98); }
    #zoomRange{ writing-mode: bt-lr; -webkit-appearance: slider-vertical; width: 32px; height: 140px; background: transparent; }
    .tool{ background:#10151d; border:1px solid #293241; color:#dce7f5; padding:10px 12px; border-radius:12px; min-width:44px; }
    .fabs{ position:absolute; right:16px; bottom:16px; z-index:16; display:flex; flex-direction:column; gap:8px; }
    .fab{ background:#2563eb; border:none; color:white; font-weight:700; padding:14px 16px; border-radius:999px; box-shadow:0 8px 24px rgba(0,0,0,.25); min-width:56px; min-height:56px; }
    .fab.secondary{ background:#475569; }
    .fab.warn{ background:#ea580c; }

    .hide{ display:none !important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <button id="btnPanel" class="iconbtn" title="리스트">🗂️</button>
      <div class="title" id="title">온라인 포스트잇 게시판</div>
      <button id="btnPing" class="iconbtn" title="새로고침">↻</button>
    </div>

    <div class="main" id="main">
      <!-- 그리드 1: 패널 -->
      <aside id="panel" class="panel">
        <h3>승인된 메모</h3>
        <table class="table">
          <thead>
            <tr><th class="name">닉네임</th><th class="text">내용</th><th class="act">작업</th></tr>
          </thead>
          <tbody id="list"></tbody>
        </table>
      </aside>

      <!-- 그리드 2: 보드 -->
      <div class="board" id="board">
        <div class="world" id="world"></div>

        <!-- 도구/FAB는 보드 내부에 위치(패널과 겹치지 않음) -->
        <div class="tools">
          <div class="zoomdock">
            <button id="zoomIn"  class="square" title="확대">＋</button>
            <input id="zoomRange" type="range" min="0.5" max="2.0" step="0.01" value="1" />
            <button id="zoomOut" class="square" title="축소">−</button>
          </div>
          <button id="fitAll" class="tool">⤢ 전체</button>
          <button id="capBoard" class="tool">📷 캡처</button>
        </div>

        <div class="fabs">
          <button id="newDraft" class="fab">＋ 새 포스트잇</button>
          <button id="gotoDraft" class="fab secondary hide">⇢ 작성중 이동</button>
          <button id="clearDraft" class="fab warn hide">삭제</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ====== Config ====== */
    const API = 'https://script.google.com/macros/s/AKfycbzUnLpPMU-g88IJlFBXe82NYOu_ZA8SxRtEgziVLQcy_Y7VIivcKWKzBVzP4yxkzVmEfw/exec'; // ← 본인 /exec URL
    const NOTE = { W: 280, H: 280 };
    const CAMERA = { x: 0, y: 0, scale: 1, min: .5, max: 2 };

    /* ====== State ====== */
    const state = {
      owner: getOrSetOwner_(),
      settings: null,
      notes: [],
      draft: loadDraft_(),          // {nick,text,x,y,fs}
      panelOpen: false,
      panelDock: 'left',
      lastTapTime: 0,
      lastTapPos: {x:0,y:0},
      isPanning: false,
      panPrev: null,
      zTop: 1000 // 노트 bring-to-front용
    };

    const $root = document.documentElement;
    const $title = document.getElementById('title');
    const $panel = document.getElementById('panel');
    const $main  = document.getElementById('main');
    const $listBody  = document.getElementById('list');
    const $world = document.getElementById('world');
    const $board = document.getElementById('board');
    const $zoomRange = document.getElementById('zoomRange');
    const $fabNew = document.getElementById('newDraft');
    const $fabGo  = document.getElementById('gotoDraft');
    const $fabDel = document.getElementById('clearDraft');

    /* ====== Boot ====== */
    (async function init(){
      await bootstrap();
      bindUI();
      renderAll();
      updateFabs();
    })();

    async function bootstrap(){
      const url = `${API}?action=bootstrap&owner=${encodeURIComponent(state.owner)}`;
      const j = await (await fetch(url)).json();
      if (!j.ok) throw new Error('bootstrap failed');

      const s = j.settings.values;
      state.settings = j.settings;

      $title.textContent = toStr(s.screenTitle || '온라인 포스트잇 게시판');
      document.title = toStr(s.pageTitle || $title.textContent);
      setVar('--title-align', s.titleAlign || 'center');
      $root.style.setProperty('--panel-width', (s.panelWidthPx || '320') + 'px');
      setVar('--bg', s.bgColor || '#0f1115');

      const ns = parseInt(s.noteSizePx || '280', 10);
      NOTE.W = NOTE.H = ns; setVar('--note-size', ns+'px');

      CAMERA.min = parseFloat(s.zoomMin || '0.5') || .5;
      CAMERA.max = parseFloat(s.zoomMax || '2.0') || 2;
      CAMERA.scale = parseFloat(s.zoomDefault || '1.0') || 1;
      $zoomRange.min = CAMERA.min; $zoomRange.max = CAMERA.max; $zoomRange.value = CAMERA.scale;

      if (j.settings.assets && j.settings.assets.bg) setVar('--board-image', `url(${j.settings.assets.bg})`);
      if (j.settings.assets && j.settings.assets.postit) setVar('--postit-image', `url(${j.settings.assets.postit})`);

      state.panelDock = (s.panelDock || 'left');
      applyPanelLayout_();

      state.notes = (j.data || []).map(sanitizeNote);

      if (state.draft) saveDraft_(Object.assign({}, state.draft));

      updateCamera(0, 0, CAMERA.scale);
      fitAll();
    }

    /* ====== UI ====== */
    function bindUI(){
      document.getElementById('btnPanel').onclick = togglePanel;
      document.getElementById('btnPing').onclick = async ()=>{ await refreshList(); fitAll(); };

      document.getElementById('zoomIn').onclick  = () => setZoomAtCenter(CAMERA.scale * 1.1);
      document.getElementById('zoomOut').onclick = () => setZoomAtCenter(CAMERA.scale / 1.1);
      $zoomRange.oninput = e => setZoomAtCenter(parseFloat(e.target.value));
      document.getElementById('fitAll').onclick = fitAll;
      document.getElementById('capBoard').onclick = () => captureElem($board, 'board.png');

      $fabNew.onclick = () => {
        const wc = worldCenter();
        createDraftAt({x: wc.x - NOTE.W/2, y: wc.y - NOTE.H/2}, true);
      };
      $fabDel.onclick = clearDraft;
      $fabGo.onclick  = () => centerOnDraft(1.0);

      // Pan
      $board.addEventListener('pointerdown', onPanStart, {passive:false});
      $board.addEventListener('pointermove', onPanMove,  {passive:false});
      $board.addEventListener('pointerup',   onPanEnd,   {passive:false});
      $board.addEventListener('pointercancel', onPanEnd, {passive:false});
      $board.addEventListener('wheel', onWheelPanZoom, {passive:false});

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && state.panelOpen) togglePanel();
        if (e.key === 'ArrowLeft')  { CAMERA.x += 80; setCamVars_(); }
        if (e.key === 'ArrowRight') { CAMERA.x -= 80; setCamVars_(); }
        if (e.key === 'ArrowUp')    { CAMERA.y += 80; setCamVars_(); }
        if (e.key === 'ArrowDown')  { CAMERA.y -= 80; setCamVars_(); }
      });
    }

    function togglePanel(){
      state.panelOpen = !state.panelOpen;
      applyPanelLayout_();
    }
    function applyPanelLayout_(){
      $main.classList.toggle('dock-right', state.panelDock === 'right');
      $main.classList.toggle('open', state.panelOpen);
    }

    async function refreshList(){
      const url = `${API}?action=list&owner=${encodeURIComponent(state.owner)}`;
      const j = await (await fetch(url)).json();
      if (j.ok) { state.notes = (j.data || []).map(sanitizeNote); renderAll(); }
    }

    /* ====== Rendering ====== */
    function renderAll(){ renderNotes(); renderList(); updateFabs(); }

    function renderNotes(){
      $world.innerHTML = '';
      let z = 1;

      for (const n of state.notes) {
        const el = document.createElement('div');
        el.className = 'note';
        el.dataset.id = n.id || '';
        el.style.left = (n.x || 0) + 'px';
        el.style.top  = (n.y || 0) + 'px';
        el.style.width = NOTE.W+'px';
        el.style.height = NOTE.H+'px';
        el.style.zIndex = z++;
        el.innerHTML = `
          <div class="nick">${escapeHtml(toStr(n.nick || '익명'))}</div>
          <div class="body" style="font-size:${(n.fs||14)}pt">${escapeHtml(toStr(n.text))}</div>
        `;
        // C-1: 단일 클릭 시 최상단으로
        el.addEventListener('click', () => bringNodeToFront_(el));
        // 더블클릭은 화면 중앙으로(줌은 유지)
        el.addEventListener('dblclick', () => focusNote(n, { zoomLikeDraft:false, openPanel:true, bringFront:true }));
        $world.appendChild(el);
      }

      // Draft
      if (state.draft) {
        const d = state.draft;
        const el = document.createElement('div');
        el.className = 'note draft';
        el.style.left = (d.x || 0) + 'px';
        el.style.top  = (d.y || 0) + 'px';
        el.style.width = NOTE.W+'px';
        el.style.height = NOTE.H+'px';
        el.style.zIndex = state.zTop + 1; // 작성중은 항상 위쪽
        el.innerHTML = `
          <div class="dragHandle">드래그 하여 이동</div>
          <input id="dNick" class="nickInput" maxlength="12" placeholder="닉네임(최대 12자)" value="${escapeAttr(toStr(d.nick||''))}">
          <textarea id="dText" class="textInput" placeholder="내용을 입력하세요 (제출 후 수정/삭제 불가)" style="font-size:${(d.fs||16)}pt">${escapeText(toStr(d.text||''))}</textarea>
          <div class="fsDial">
            <input id="dFs" type="range" min="10" max="48" step="1" value="${d.fs||16}">
            <div class="fsVal">${d.fs||16}pt</div>
          </div>
          <div class="ctrlBar">
            <button id="dSubmit">제출</button>
            <button id="dDelete" class="del">삭제</button>
          </div>
        `;

        enableDrag(el, (dx, dy) => {
          d.x = (d.x||0) + dx / CAMERA.scale;
          d.y = (d.y||0) + dy / CAMERA.scale;
          saveDraft_(d);
          el.style.left = d.x + 'px';
          el.style.top  = d.y + 'px';
        }, '.dragHandle');

        wireDraftForm_(el, d);
        $world.appendChild(el);
      }
    }

    // C-2.2/2.3: 리스트 패널 행 클릭만으로 이동 + 버튼 클릭도 이동/캡쳐
    function renderList(){
      const items = state.notes.filter(n => String(n.status).toLowerCase()==='approved')
        .sort((a,b)=> (+new Date(a.ts||a.tsKR)) - (+new Date(b.ts||b.tsKR)));
      $listBody.innerHTML = '';
      for (const n of items) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="name">${escapeHtml(toStr(n.nick||'익명'))}</td>
          <td class="text"><span class="ell">${escapeHtml(toStr(n.text))}</span></td>
          <td class="act">
            <button class="rowbtn btn-move" style="margin-right:6px;">이동</button>
            <button class="rowbtn btn-cap">캡쳐</button>
          </td>
        `;

        // 행 전체 클릭 → 이동(줌 100% + 중앙 + 최상단 + 패널 자동 열기)
        tr.addEventListener('click', () => focusNote(n, { zoomLikeDraft:true, openPanel:true, bringFront:true }));

        // 버튼들은 이벤트 전파 막고 각각 동작
        const btnMove = tr.querySelector('.btn-move');
        const btnCap  = tr.querySelector('.btn-cap');
        btnMove.addEventListener('click', (e) => {
          e.stopPropagation();
          focusNote(n, { zoomLikeDraft:true, openPanel:true, bringFront:true });
        });
        btnCap.addEventListener('click', async (e) => {
          e.stopPropagation();
          const node = findNoteNode_(n.id);
          if (node) await captureElem(node, `note-${(n.id||'')}.png`);
        });

        $listBody.appendChild(tr);
      }
    }

    // 공통 포커스: 옵션으로 줌/최상단/패널 제어
    function focusNote(n, opts){
      const { zoomLikeDraft=false, openPanel=false, bringFront=false } = (opts||{});
      const center = { x: (n.x||0) + NOTE.W/2, y: (n.y||0) + NOTE.H/2 };

      if (zoomLikeDraft) {
        const r = $board.getBoundingClientRect();
        setZoomAtPoint(1.0, r.left + r.width/2, r.top + r.height/2);
      }
      focusWorldPoint(center);

      if (bringFront) {
        const node = findNoteNode_((n.id||''));
        if (node) bringNodeToFront_(node);
      }
      if (openPanel && !state.panelOpen) togglePanel();
    }

    /* ====== Draft ====== */
    function wireDraftForm_(root, d){
      const $nick = root.querySelector('#dNick');
      const $text = root.querySelector('#dText');
      const $fs   = root.querySelector('#dFs');
      const $submit = root.querySelector('#dSubmit');
      const $del    = root.querySelector('#dDelete');
      const $fsVal  = root.querySelector('.fsVal');

      const sync = () => {
        d.nick = $nick.value.trim();
        d.text = $text.value;
        d.fs = parseInt($fs.value,10)||16;
        $fsVal.textContent = d.fs+'pt';
        $text.style.fontSize = d.fs+'pt';
        saveDraft_(d);
      };

      $nick.oninput = sync;
      $text.oninput = sync;
      $fs.oninput = sync;

      $submit.onclick = async () => {
        if (!d.nick) { d.nick = '익명'; $nick.value = '익명'; }
        if (!d.text) { alert('내용을 입력하세요.'); return; }
        if (!confirm('이 내용으로 제출하시겠습니까? 제출 후에는 수정/삭제가 불가합니다.')) return;

        $submit.disabled = true; $del.disabled = true; $submit.textContent = '제출 중…';

        const fd = new URLSearchParams();
        fd.set('action','create');
        fd.set('owner', state.owner);
        fd.set('nick', d.nick);
        fd.set('text', d.text);
        fd.set('x', Math.round(d.x||0));
        fd.set('y', Math.round(d.y||0));
        fd.set('fs', d.fs||16);

        try{
          const res = await fetch(API, { method:'POST', body: fd });
          const j = await res.json();
          if (!j.ok) { alert(j.error || '제출 실패'); $submit.disabled=false; $del.disabled=false; $submit.textContent='제출'; return; }
          alert('제출이 완료되었습니다. 승인 후 게시됩니다.');
          clearDraft();
          await refreshList();
          fitAll();
        }catch(err){
          alert('네트워크 오류로 제출에 실패했습니다.');
          $submit.disabled=false; $del.disabled=false; $submit.textContent='제출';
        }
      };

      $del.onclick = clearDraft;
    }

    function createDraftAt(pos, zoomToCenter=false){
      if (state.draft) { alert('작성 중인 메모가 이미 있습니다. 먼저 제출 또는 삭제하세요.'); return; }
      state.draft = { nick: '', text: '', x: Math.max(0, Math.round(pos.x||0)), y: Math.max(0, Math.round(pos.y||0)), fs: 16 };
      saveDraft_(state.draft);
      renderAll();
      if (zoomToCenter) centerOnDraft(1.0);
    }

    function centerOnDraft(scale=1.0){
      if (!state.draft) { alert('작성 중인 메모가 없습니다.'); return; }
      const d = state.draft;
      const center = { x: (d.x||0) + NOTE.W/2, y: (d.y||0) + NOTE.H/2 };
      const r = $board.getBoundingClientRect();
      setZoomAtPoint(scale, r.left + r.width/2, r.top + r.height/2);
      focusWorldPoint(center);
    }

    function clearDraft(){ state.draft = null; localStorage.removeItem('mn_draft'); renderAll(); }
    function saveDraft_(d){ localStorage.setItem('mn_draft', JSON.stringify(d)); }
    function loadDraft_(){ try{ return JSON.parse(localStorage.getItem('mn_draft')||'null'); }catch(e){ return null; } }
    function updateFabs(){ const hasDraft = !!state.draft; $fabGo.classList.toggle('hide', !hasDraft); $fabDel.classList.toggle('hide', !hasDraft); }

    /* ====== Z-order helpers ====== */
    function bringNodeToFront_(node){ node.style.zIndex = ++state.zTop; }
    function findNoteNode_(id){ return $world.querySelector(`.note[data-id="${CSS.escape(id||'')}"]`); }

    /* ====== Camera & Geometry (TOP-LEFT ORIGIN) ====== */
    function toWorld(cx, cy){
      const r = $board.getBoundingClientRect();
      const sx = cx - r.left;
      const sy = cy - r.top;
      return { x: (sx - CAMERA.x) / CAMERA.scale, y: (sy - CAMERA.y) / CAMERA.scale };
    }
    function worldCenter(){
      const r = $board.getBoundingClientRect();
      const cx = r.left + r.width/2;
      const cy = r.top  + r.height/2;
      return toWorld(cx, cy);
    }
    function focusWorldPoint(p){
      const r = $board.getBoundingClientRect();
      const cx = r.width / 2;
      const cy = r.height / 2;
      CAMERA.x = cx - p.x * CAMERA.scale;
      CAMERA.y = cy - p.y * CAMERA.scale;
      setCamVars_();
    }
    function setZoomAtCenter(newScale){
      const r = $board.getBoundingClientRect();
      const cx = r.left + r.width/2;
      const cy = r.top  + r.height/2;
      setZoomAtPoint(newScale, cx, cy);
    }
    function setZoomAtPoint(newScale, cx, cy){
      const ns = clamp(newScale, CAMERA.min, CAMERA.max);
      const before = CAMERA.scale;
      const r = $board.getBoundingClientRect();
      const sx = cx - r.left;
      const sy = cy - r.top;
      const wx = (sx - CAMERA.x) / before;
      const wy = (sy - CAMERA.y) / before;
      CAMERA.scale = ns;
      CAMERA.x = sx - wx * CAMERA.scale;
      CAMERA.y = sy - wy * CAMERA.scale;
      $zoomRange.value = CAMERA.scale;
      setCamVars_();
    }
    function updateCamera(x,y,scale){ CAMERA.x = x; CAMERA.y = y; CAMERA.scale = scale; $zoomRange.value = CAMERA.scale; setCamVars_(); }
    function setCamVars_(){ setVar('--scale', CAMERA.scale); setVar('--cam-x', CAMERA.x+'px'); setVar('--cam-y', CAMERA.y+'px'); }
    function boundsOf(rects){
      const xs = rects.map(r=>r.x), ys = rects.map(r=>r.y);
      const xe = rects.map(r=>r.x+r.w), ye = rects.map(r=>r.y+r.h);
      const minx = Math.min(...xs), miny = Math.min(...ys);
      const maxx = Math.max(...xe), maxy = Math.max(...ye);
      return { x:minx, y:miny, w:maxx-minx, h:maxy-miny };
    }

    /* ====== Pan / Wheel ====== */
    function onPanStart(ev){
      // 입력/버튼/패널/툴스/핸들/컨트롤/세로슬라이더 위에서는 패닝 비활성화
      if (ev.target.closest('input, textarea, button, select, .panel, .tools, .dragHandle, .ctrlBar, .fsDial')) return;

      state.isPanning = true;
      state.panPrev = {x: ev.clientX, y: ev.clientY};
      $board.classList.add('panning');

      // 더블탭: 클릭 위치에 생성 후 100% 줌 & 중앙 배치
      const now = Date.now();
      const dt  = now - state.lastTapTime;
      const dist = Math.hypot(ev.clientX - state.lastTapPos.x, ev.clientY - state.lastTapPos.y);
      if (dt < 300 && dist < 12) {
        const wpt = toWorld(ev.clientX, ev.clientY);
        createDraftAt({x:wpt.x - NOTE.W/2, y:wpt.y - NOTE.H/2}, true);
        state.lastTapTime = 0;
        state.isPanning = false;
        $board.classList.remove('panning');
      } else {
        state.lastTapTime = now;
        state.lastTapPos = {x: ev.clientX, y: ev.clientY};
      }

      ev.preventDefault(); // 노트 영역에서도 화면 이동 가능
    }
    function onPanMove(ev){
      if (!state.isPanning || !state.panPrev) return;
      const dx = ev.clientX - state.panPrev.x;
      const dy = ev.clientY - state.panPrev.y;
      state.panPrev = {x: ev.clientX, y: ev.clientY};
      CAMERA.x += dx;
      CAMERA.y += dy;
      setCamVars_();
      ev.preventDefault();
    }
    function onPanEnd(){ state.isPanning = false; state.panPrev = null; $board.classList.remove('panning'); }

    function onWheelPanZoom(e){
      if (e.target.closest('input, textarea, button, select, .panel, .tools, .dragHandle, .ctrlBar, .fsDial')) return;
      e.preventDefault();
      if (e.ctrlKey) {
        const factor = Math.exp(-e.deltaY * 0.0015);
        setZoomAtPoint(CAMERA.scale * factor, e.clientX, e.clientY);
      } else {
        const k = 1;
        let dx = e.deltaX, dy = e.deltaY;
        if (Math.abs(dx) < 1 && e.shiftKey) dx = dy;
        CAMERA.x -= dx * k;
        CAMERA.y -= dy * k;
        setCamVars_();
      }
    }

    /* ====== Capture ====== */
    async function captureElem(el, filename){
      try{
        if (!window.html2canvas) throw new Error('no html2canvas');
        const canvas = await html2canvas(el, {backgroundColor: null, useCORS: true, scale: 2});
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = filename || 'capture.png';
        a.click();
      } catch (e) { window.print(); }
    }

    /* ====== Utils ====== */
    function toStr(v){ return v == null ? '' : (typeof v === 'string' ? v : String(v)); }
    function getOrSetOwner_(){ let id = localStorage.getItem('mn_owner'); if (!id) { id = cryptoRandomId_(); localStorage.setItem('mn_owner', id); } return id; }
    function cryptoRandomId_(){ const a = new Uint8Array(16); crypto.getRandomValues(a); return [...a].map(x=>x.toString(16).padStart(2,'0')).join(''); }
    function setVar(k, v){ $root.style.setProperty(k, v); }
    function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
    function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    function escapeAttr(s){ return String(s).replace(/"/g, '&quot;'); }
    function escapeText(s){ return String(s).replace(/</g, '&lt;'); }

    function sanitizeNote(n){
      return {
        ...n,
        nick: toStr(n.nick),
        text: toStr(n.text),
        tsKR: toStr(n.tsKR),
        ts: toStr(n.ts),
        status: (n.status||'').toString().toLowerCase(),
        x: Number(n.x) || 0,
        y: Number(n.y) || 0,
        fs: Number(n.fs) || 16
      };
    }

    // enableDrag with optional handle
    function enableDrag(el, ondrag, handleSelector){
      const handle = handleSelector ? el.querySelector(handleSelector) : el;
      let prev = null;
      handle.addEventListener('pointerdown', (ev)=>{
        prev = {x:ev.clientX, y:ev.clientY};
        handle.setPointerCapture(ev.pointerId);
        ev.stopPropagation(); // 보드 패닝과 충돌 방지
      });
      handle.addEventListener('pointermove', (ev)=>{
        if (!prev) return;
        const dx = ev.clientX - prev.x, dy = ev.clientY - prev.y;
        prev = {x:ev.clientX, y:ev.clientY};
        ondrag(dx, dy);
      });
      const end = ()=> { prev=null; };
      handle.addEventListener('pointerup', end);
      handle.addEventListener('pointercancel', end);
    }
  </script>
</body>
