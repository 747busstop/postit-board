<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>온라인 포스트잇 게시판</title>
  <style>
    :root{
      --bg:#ffffff;
      --text:#e8eaed;
      --title-color:#000000;
      --title-align:center;
      --postit-image:none;
      --board-image:none;
      --note-size: clamp(200px, 28.6vw, 328px);
      --nav-top: calc(50% - 210px);
      --panel-width:0px;
      --fab-bottom-base:52px;
      --fab-bottom-gap:84px;
    }
    *{ box-sizing:border-box; }
    html,body{ margin:0; height:100%; background:var(--bg); color:var(--text); font-family:"Noto Sans KR",system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; }

    .header{
      position:fixed; top:0; left:0; right:0; z-index:120;
      display:grid; grid-template-columns:auto 1fr auto; align-items:center;
      gap:14px; padding:12px 18px;
      background:rgba(0,0,0,0.28);
      backdrop-filter:saturate(160%) blur(14px);
      border-bottom:1px solid rgba(255,255,255,0.12);
    }
    .header-left{ display:flex; align-items:center; gap:8px; }
    .title{
      margin:0; justify-self:stretch;
      font-size:clamp(20px, 3.8vw, 26px); font-weight:800; letter-spacing:.35px;
      color:var(--title-color); text-align:var(--title-align);
      text-shadow:0 1px 0 rgba(0,0,0,0.32);
    }
    .header-actions{
      display:flex; align-items:center; justify-content:flex-end; gap:10px;
    }
    .header-btn{
      border:none; padding:9px 14px; border-radius:12px;
      background:rgba(255,255,255,0.9); color:#111;
      font-weight:700; font-size:14px; cursor:pointer;
      box-shadow:0 8px 20px rgba(0,0,0,0.25);
    }
    .header-btn:hover{ background:#fff; }
    .header-btn--icon{
      display:none; align-items:center; justify-content:center;
      padding:9px; width:42px; height:42px; border-radius:50%;
      font-size:18px; line-height:1;
    }

    #board{
      position:absolute;
      top:var(--board-top, 64px);
      left:var(--panel-width, 0px);
      right:0;
      bottom:0;
      overflow:auto;
      padding:24px 18px 110px;
      background: var(--bg);
      background-image: var(--board-image),
        radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: cover, 24px 24px;
      background-position: center, 0 0;
      touch-action: none;
      transition:left .22s ease;
    }
    #boardScaler{ position:relative; width:100%; height:100%; }
    #boardWorld{ position:relative; transform-origin:top left; }
    .note{
      position:absolute; width:var(--note-size); height:var(--note-size);
      padding:12px; background-color:transparent;
      background-image:var(--postit-image); background-size:cover;
      background-position:center; background-repeat:no-repeat;
      box-shadow:0 14px 28px rgba(0,0,0,0.35);
      color:#111; overflow:hidden; touch-action:none;
    }
    .note .head{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      margin-bottom:8px; font-size:13px; font-weight:800; color:#111;
      text-shadow:0 1px 0 rgba(255,255,255,0.85); flex-wrap:nowrap;
    }
    .inline{ display:flex; align-items:center; gap:6px; background:transparent; border:none; padding:4px 0; }
    .nick-edit{
      width:132px; border:none; outline:none; background:transparent;
      color:#111; font-weight:800; font-size:13px;
      border-bottom:1px dashed rgba(0,0,0,.28);
    }
    .badge{
      font-size:12px; padding:3px 8px; border-radius:7px;
      border:1px solid rgba(0,0,0,0.12); background:rgba(255,255,255,0.78);
      color:#111; font-weight:700;
    }
    .note .content{
      width:100%; height:calc(100% - 72px);
      border:none; background:transparent; outline:none; resize:none;
      font-size:16px; line-height:1.42; color:#111; overflow:auto;
      text-shadow:0 1px 0 rgba(255,255,255,0.7);
    }
    .note--capturing{
      box-shadow:none !important;
      filter:brightness(1.45) saturate(1.08) contrast(0.96);
      background-color:#ffffff;
    }
    .range{ appearance:none; height:5px; border-radius:999px; background:rgba(0,0,0,.18);
      width:min(240px, calc(var(--note-size) - 86px)); }
    .range::-webkit-slider-thumb{
      appearance:none; width:18px; height:18px; border-radius:50%;
      background:#fff; border:1px solid #c9ced6;
    }
    .draft-slider{ position:absolute; left:14px; bottom:16px; display:flex; align-items:center; transform:scale(0.7); transform-origin:left bottom; }
    .draft-actions{ position:absolute; right:16px; bottom:18px; display:flex; flex-direction:column; gap:10px; align-items:flex-end; transform:scale(0.7); transform-origin:right bottom; }
    .mini{ font-size:13px; padding:8px 16px; border-radius:14px; background:#fff; border:1px solid #c9ced6; color:#111; cursor:pointer; font-weight:700; }
    .mini[disabled]{ opacity:.5; cursor:not-allowed; }
    .note--draft{ outline:3px solid rgba(255,120,40,0.68);
      box-shadow:0 24px 48px rgba(255,120,40,0.36), 0 0 0 4px rgba(255,255,255,0.48); }
    .note--draft::after{
      content:'작성 중'; position:absolute; top:10px; right:10px;
      padding:5px 12px; border-radius:999px; background:rgba(255,255,255,0.9);
      color:#c65000; font-size:12px; font-weight:700; letter-spacing:0.2px;
    }
    .note--pulse{ animation:draftPulse 1.2s ease-out 2; }
    @keyframes draftPulse{
      0%{ box-shadow:0 26px 54px rgba(255,140,40,0.50), 0 0 0 4px rgba(255,255,255,0.72); }
      50%{ box-shadow:0 30px 60px rgba(255,140,40,0.70), 0 0 0 7px rgba(255,196,120,0.6); }
      100%{ box-shadow:0 26px 54px rgba(255,140,40,0.50), 0 0 0 4px rgba(255,255,255,0.34); }
    }
    .fab-container{ position:relative; }
    .fab{
      position:fixed; right:18px; z-index:12040;
      background:#fff; color:#111; border:1px solid #c9ced6; border-radius:999px;
      padding:20px 26px; font-size:16px; font-weight:800; cursor:pointer;
      box-shadow:0 14px 34px rgba(0,0,0,.35);
      bottom:var(--fab-bottom-base);
    }
    .fab[disabled]{ opacity:.5; cursor:not-allowed; }
    .fab-delete{ bottom:calc(var(--fab-bottom-base) + var(--fab-bottom-gap)); background:#ffebe1; border-color:#ffc7a1; }
    .fab-jump{ bottom:calc(var(--fab-bottom-base) + var(--fab-bottom-gap) * 2); background:#e8f0ff; border-color:#c0d5ff; }
    .fab--mobile{
      position:relative; right:auto; bottom:auto;
      padding:10px 16px; border-radius:12px; box-shadow:none;
      display:inline-flex; align-items:center; justify-content:center;
      font-size:15px; background:rgba(255,255,255,0.92);
    }
    .fab--mobile + .fab--mobile{ margin-left:6px; }
    .fab-container--mobile{
      display:flex; align-items:center; justify-content:flex-end; gap:6px;
      width:100%;
    }

    .loading{
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:rgba(15,17,21,0.55); backdrop-filter:blur(6px); z-index:15000;
      transition:opacity .2s ease; pointer-events:none;
    }
    .loading[aria-hidden="true"]{ opacity:0; visibility:hidden; }
    .spinner{ width:56px; height:56px; border-radius:50%; border:4px solid rgba(255,255,255,0.25); border-top-color:#fff; animation:spin 1s linear infinite; }
    @keyframes spin{ to{ transform:rotate(360deg);} }

    .zoom-controls{
      position:fixed; right:18px; top:var(--nav-top);
      display:flex; flex-direction:column; gap:14px; z-index:12030;
    }
    .zoom-controls button{
      width:64px; height:64px; border-radius:20px;
      border:1px solid rgba(255,255,255,0.45);
      background:rgba(0,0,0,0.55); color:#fff; font-size:20px; cursor:pointer;
      backdrop-filter:blur(6px);
    }
    .zoom-controls button:hover{ background:rgba(0,0,0,0.72); }

    .zoom-panel{
      position:fixed; right:102px; top:calc(50% - 32px);
      display:flex; align-items:center; gap:12px; padding:14px 18px;
      border-radius:18px; background:rgba(15,17,21,0.84); color:#fff;
      box-shadow:0 16px 42px rgba(0,0,0,0.36); backdrop-filter:blur(10px);
      z-index:12020; opacity:0; pointer-events:none; transform:translateY(12px);
      transition:opacity .18s ease, transform .18s ease;
    }
    .zoom-panel[data-open="true"]{ opacity:1; pointer-events:auto; transform:translateY(0); }
    .zoom-panel input[type="range"]{ width:200px; accent-color:#4d85ff; }
    .zoom-panel .zoom-label{ font-size:13px; opacity:0.82; }
    .zoom-panel #zoomValue{ min-width:58px; text-align:right; font-weight:700; font-size:14px; }
    .zoom-panel-actions{
      display:none; gap:8px; width:100%;
    }
    .zoom-panel-actions button{
      flex:1 1 auto; border:none; border-radius:12px; padding:10px 0;
      background:rgba(255,255,255,0.14); color:#fff; font-weight:700; cursor:pointer;
    }

    .sidepanel{
      position:fixed; top:var(--board-top,64px); left:0; bottom:0;
      width:var(--panel-base-width, min(460px, 92vw)); background:#1f232d; color:#fff;
      border-right:1px solid rgba(255,255,255,0.12);
      transform:translateX(-100%); transition:transform .22s ease;
      z-index:10000; display:flex; flex-direction:column;
      box-shadow:20px 0 32px rgba(0,0,0,0.35);
    }
    .sidepanel[data-open="true"]{ transform:translateX(0); }
    .sidepanel header{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:14px 16px; background:rgba(255,255,255,0.06);
    }
    .sidepanel header h2{ margin:0; font-size:16px; font-weight:800; }
    .sidepanel .close-btn{
      border:none; background:rgba(255,255,255,0.16); color:#fff;
      padding:6px 10px; border-radius:8px; cursor:pointer;
    }
    .sidepanel .body{
      flex:1 1 auto; overflow:auto; padding:12px 12px 18px;
    }
    .sidepanel table{ width:100%; border-collapse:collapse; background:#14171f; border-radius:12px; overflow:hidden; table-layout:fixed; }
    .sidepanel col.col-nick{ width:26%; }
    .sidepanel col.col-actions{ width:120px; }
    .sidepanel col.col-text{ width:auto; }
    .sidepanel thead{ position:sticky; top:0; background:rgba(255,255,255,0.12); }
    .sidepanel th, .sidepanel td{ padding:10px 12px; font-size:13px; border-bottom:1px solid rgba(255,255,255,0.08); text-align:left; }
    .sidepanel th.col-text, .sidepanel td.col-text{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sidepanel th.col-nick, .sidepanel td.col-nick, .sidepanel th.col-actions, .sidepanel td.col-actions{ white-space:nowrap; }
    .sidepanel tbody tr:last-child td{ border-bottom:none; }
    .sidepanel tbody tr:hover{ background:rgba(255,255,255,0.05); }
    .row-actions{ display:flex; gap:6px; }
    .row-actions button{
      border:none; padding:6px 10px; border-radius:8px; cursor:pointer; font-weight:700; font-size:12px;
      background:#263248; color:#e8f0ff;
    }
    .cell-text{ display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .panel-scrim{
      position:fixed; inset:0; background:rgba(15,17,21,0.55); backdrop-filter:blur(4px);
      z-index:9995; opacity:0; pointer-events:none; transition:opacity .18s ease;
    }
    .panel-scrim[data-open="true"]{ opacity:1; pointer-events:auto; }

    body.panel-dock-right #board{
      left:0;
      right:var(--panel-width, 0px);
    }
    body.panel-dock-right .sidepanel{
      left:auto;
      right:0;
      border-right:none;
      border-left:1px solid rgba(255,255,255,0.12);
      transform:translateX(100%);
      box-shadow:-20px 0 32px rgba(0,0,0,0.35);
    }
    body.panel-dock-right .sidepanel[data-open="true"]{ transform:translateX(0); }
    body.panel-dock-right .panel-scrim{ left:0; right:0; }

    .action-sheet{
      position:fixed; inset:0;
      display:flex; align-items:flex-end; justify-content:center;
      background:rgba(15,17,21,0.55);
      backdrop-filter:blur(6px);
      z-index:16000;
      opacity:0; pointer-events:none;
      transition:opacity .18s ease;
    }
    .action-sheet[data-open="true"]{ opacity:1; pointer-events:auto; }
    .action-sheet__panel{
      width:100%;
      max-width:520px;
      background:#111620;
      border-radius:20px 20px 0 0;
      padding:18px 20px 28px;
      box-shadow:0 -20px 40px rgba(0,0,0,0.4);
      transform:translateY(32px);
      transition:transform .18s ease;
    }
    .action-sheet[data-open="true"] .action-sheet__panel{ transform:translateY(0); }
    .action-sheet__title{
      margin:0 0 16px; font-size:16px; font-weight:800; color:#f1f3f5;
      text-align:center;
    }
    .action-sheet__buttons{ display:flex; flex-direction:column; gap:12px; }
    .action-sheet__buttons button{
      border:none; border-radius:14px;
      padding:14px 16px;
      background:#1d2533;
      color:#e8ecf8;
      font-size:15px; font-weight:700;
      display:flex; align-items:center; justify-content:space-between;
      cursor:pointer;
      transition:background .15s ease;
    }
    .action-sheet__buttons button:hover,
    .action-sheet__buttons button:focus{ background:#273349; outline:none; }
    .action-sheet__buttons button span{ font-size:12px; opacity:0.72; }
    .action-sheet__close{
      margin-top:18px;
      width:100%;
      border:none;
      border-radius:14px;
      padding:12px 16px;
      background:rgba(255,255,255,0.14);
      color:#f1f3f5;
      font-weight:700;
      font-size:14px;
      cursor:pointer;
    }


    @media (max-width: 1024px){
      body.panel-overlay-open #board,
      body.panel-overlay-open .zoom-controls,
      body.panel-overlay-open .fab{ pointer-events:none; }
    }

    @media (max-width: 820px){
      .header{ padding:10px 14px; gap:10px; }
      .header-btn{ font-size:13px; padding:8px 12px; }
      .fab, .fab-delete, .fab-jump{ right:12px; padding:22px 30px; font-size:18px; }
      .zoom-controls{ right:10px; gap:16px; top:var(--nav-top); }
      .zoom-controls button{ width:90px; height:90px; border-radius:26px; font-size:26px; }
      .zoom-panel{ right:105px; padding:16px 20px; }
      .zoom-panel input[type="range"]{ width:236px; }
    }

    body.is-mobile .header{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      padding:12px 16px 14px;
    }
    body.is-mobile .header-left{
      order:1;
      flex:0 0 auto;
    }
    body.is-mobile .title{
      order:3;
      flex:1 0 100%;
      text-align:left;
      font-size:clamp(18px, 5vw, 24px);
    }
    body.is-mobile .header-actions{
      order:2;
      flex:1 1 auto;
      justify-content:flex-end;
      flex-wrap:wrap;
      gap:6px;
    }
    body.is-mobile .header-btn--icon{ display:inline-flex; }
    body.is-mobile #zoomControls{ display:none; }
    body.is-mobile .zoom-panel{
      left:12px; right:12px; top:calc(var(--board-top, 64px) + 8px);
      width:auto; transform:none;
      flex-direction:column; align-items:flex-start; gap:8px;
      padding:16px 18px;
    }
    body.is-mobile .zoom-panel[data-open="true"]{ transform:none; }
    body.is-mobile .zoom-panel input[type="range"]{ width:100%; }
    body.is-mobile .zoom-panel #zoomValue{ align-self:flex-end; }
    body.is-mobile .zoom-panel-actions{ display:flex; }
    body.is-mobile .zoom-panel-actions button{
      background:rgba(255,255,255,0.18);
      border:1px solid rgba(255,255,255,0.28);
    }
    body.is-mobile .fab.is-hidden{ display:none !important; }
    body.is-mobile #board{ left:0; }

    body.is-tiny .fab-container--mobile{ display:none !important; }

    body.action-sheet-open #board,
    body.action-sheet-open .zoom-controls,
    body.action-sheet-open .fab{ pointer-events:none; }

    .is-hidden{ visibility:hidden; opacity:0.1; }
  </style>
</head>
<body>
  <div class="header" id="header">
    <div class="header-left">
      <button type="button" id="listBtn" class="header-btn header-btn--icon" title="리스트 보기" aria-label="리스트 보기">🗂️</button>
    </div>
    <h1 class="title" id="screenTitle">온라인 포스트잇 게시판</h1>
    <div class="header-actions" id="headerActions">
      <button type="button" id="mobileToolsBtn" class="header-btn header-btn--icon" title="보드 도구" aria-label="보드 도구" aria-haspopup="true" aria-expanded="false">⚙︎</button>
    </div>
  </div>

  <div id="board" aria-label="온라인 포스트잇 게시판">
    <div id="boardScaler">
      <div id="boardWorld"></div>
    </div>
  </div>

  <div id="loading" class="loading" role="status" aria-live="polite">
    <div class="spinner" aria-label="포스트잇을 불러오는 중입니다."></div>
  </div>

  <div id="zoomControls" class="zoom-controls" role="group" aria-label="보드 도구">
    <button type="button" data-action="togglePanel" title="돋보기">🔍</button>
    <button type="button" data-action="zoomIn"    title="확대">＋</button>
    <button type="button" data-action="zoomOut"   title="축소">−</button>
    <button type="button" data-action="fit"       title="전체 보기">전체</button>
    <button type="button" data-action="capture"   title="화면 캡처">📷</button>
  </div>
  <div id="zoomPanel" class="zoom-panel" aria-hidden="true">
    <label class="zoom-label" for="zoomSlider">확대/축소</label>
    <input id="zoomSlider" type="range" min="0.5" max="2.5" step="0.05" value="1">
    <span id="zoomValue">100%</span>
    <div id="zoomPanelActions" class="zoom-panel-actions" role="group" aria-label="보드 단축키">
      <button type="button" data-action="zoomIn" title="확대">＋</button>
      <button type="button" data-action="zoomOut" title="축소">−</button>
      <button type="button" data-action="fit" title="전체 보기">전체</button>
      <button type="button" data-action="capture" title="화면 캡처">📷</button>
    </div>
  </div>

  <div id="fabContainer" class="fab-container">
    <button id="jumpDraftBtn" class="fab fab-jump" title="작성 중 포스트잇으로 이동">작성중 이동</button>
    <button id="deleteDraftBtn" class="fab fab-delete" title="작성 중 포스트잇 삭제">작성중 삭제</button>
    <button id="addBtn" class="fab" title="새 포스트잇 만들기">＋ 새 포스트잇</button>
  </div>

  <aside id="listPanel" class="sidepanel" aria-hidden="true" role="dialog" aria-label="포스트잇 목록 패널">
    <header>
      <h2>포스트잇 목록</h2>
      <button type="button" id="listCloseBtn" class="close-btn" title="닫기">닫기</button>
    </header>
    <div class="body">
      <table>
        <colgroup>
          <col class="col-nick">
          <col class="col-text">
          <col class="col-actions">
        </colgroup>
        <thead>
          <tr><th class="col-nick">닉네임</th><th class="col-text">내용</th><th class="col-actions">작업</th></tr>
        </thead>
        <tbody id="panelTableBody"></tbody>
      </table>
    </div>
  </aside>
  <div id="panelScrim" class="panel-scrim" aria-hidden="true"></div>
  <div id="actionSheet" class="action-sheet" role="dialog" aria-modal="true" aria-labelledby="actionSheetTitle" aria-hidden="true">
    <div class="action-sheet__panel" role="document">
      <h2 id="actionSheetTitle" class="action-sheet__title">빠른 도구</h2>
      <div class="action-sheet__buttons" id="actionSheetButtons">
        <button type="button" data-sheet-action="add">＋ 새 포스트잇<span>초안을 바로 만들어요</span></button>
        <button type="button" data-sheet-action="jump">작성중 이동<span>현재 초안 위치로 이동</span></button>
        <button type="button" data-sheet-action="delete">작성중 삭제<span>진행 중인 초안을 정리</span></button>
        <button type="button" data-sheet-action="zoomIn">확대<span>보드를 확대합니다</span></button>
        <button type="button" data-sheet-action="zoomOut">축소<span>보드를 축소합니다</span></button>
        <button type="button" data-sheet-action="fit">전체 보기<span>모든 포스트잇 한눈에</span></button>
      </div>
      <button type="button" id="actionSheetCloseBtn" class="action-sheet__close">닫기</button>
    </div>
  </div>

  <script>
    /* ================================================
    * [API BRIDGE] GitHub Pages → GAS(Web App)
    * - WEB_APP_URL: GAS 웹앱 배포 URL (https://script.google.com/macros/s/…/exec)
    * - API_KEY: (선택) 서버에서 요구 시 전송
    * - HAS_GAS: 기존 google.script.run 환경(내장 실행) 탐지
    *   GET  ?action=bootstrap&ownerToken=...&previousSignature=...&previousNotesSignature=...
    *   GET  ?action=list&ownerToken=...&previousNotesSignature=...
    *   GET  ?action=config&previousSignature=...
    *   GET  ?action=ping

          pinchStartDistance = dist;
          pinchStartZoom = zoomLevel;
          pinchTargetZoom = zoomLevel;
        } else if (pinchStartDistance > 0){
          const rawTarget = pinchStartZoom * (dist / pinchStartDistance);
          pinchTargetZoom = clamp(rawTarget, MIN_ZOOM, MAX_ZOOM);
          if (!pinchRaf){
            pinchRaf = requestAnimationFrame(applyPinchZoomFrame);
          }
        }
        e.preventDefault();
      }
    }
    function handlePointerUp(e){
      if (e.pointerType !== 'touch') return;
      const info = activePointers.get(e.pointerId);
      activePointers.delete(e.pointerId);
      if (activePointers.size < 2){
        pinchStartDistance = null;
        pinchAnchorWorld = null;
        pinchTargetZoom = null;
        pinchStartZoom = zoomLevel;
        if (pinchRaf){
          cancelAnimationFrame(pinchRaf);
          pinchRaf = null;
        }
      }
      if (info){
        const travel = Math.hypot((info.clientX - info.startX)||0, (info.clientY - info.startY)||0);
        if (travel > 12){
          return;
        }
        const now = Date.now();
        if (now - lastTapTime <= 260){
          const dx = info.clientX - lastTapPos.x;
          const dy = info.clientY - lastTapPos.y;
          const targetElem = document.elementFromPoint(info.clientX, info.clientY);
          if (Math.hypot(dx,dy) <= 35 && targetElem === boardWorld){
            const world = clientToWorld(info.clientX, info.clientY);
            const {w,h}=measureNoteSize();
            addAtBoardXY(
              Math.max(0, world.x - w/2),
              Math.max(0, world.y - h/2),
              {
                zoomTo1:false,
                forceMobileZoom:true,
                presetCenter:{x:Math.max(0, world.x), y:Math.max(0, world.y)}
              }
            );
            lastTapTime = 0;
            lastTapPos = {x:0,y:0};
            return;
          }
        }
        lastTapTime = now;
        lastTapPos = {x:info.clientX, y:info.clientY};
      }
    }
    board.addEventListener('pointerdown', handlePointerDown);
    board.addEventListener('pointermove', handlePointerMove, {passive:false});
    board.addEventListener('pointerup', handlePointerUp);
    board.addEventListener('pointercancel', handlePointerUp);

    function applyPinchZoomFrame(){
      pinchRaf = null;
      if (pinchTargetZoom == null || !pinchAnchorWorld) return;
      applyZoom(pinchTargetZoom, {keepCenter:false});
      setBoardCenterWorld(pinchAnchorWorld.x, pinchAnchorWorld.y, {behavior:'auto'});
    }

      addAtBoardXY(Math.max(0, worldX), Math.max(0, worldY), {zoomTo1:true});
    }

    async function ensureHtml2Canvas(){
      if (window.html2canvas) return;
      showLoading();
      try{
        await new Promise((resolve, reject)=>{
          const script=document.createElement('script');
          script.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
          script.onload=resolve;
          script.onerror=()=>reject(new Error('html2canvas load failed'));
          document.head.appendChild(script);
        });
      } finally{
        hideLoading();
      }
    }
    async function captureBoard(){
      try{
        // (선택) 서버 및 네트워크 워밍업 – 실패해도 무시
        try { await apiPing(); } catch(_) {}
      } catch(_){}

      try{
        const {width, height} = board.getBoundingClientRect();
        const canvas = document.createElement('canvas');
        canvas.width = Math.ceil(width * window.devicePixelRatio);
        canvas.height = Math.ceil((height + headerEl.offsetHeight) * window.devicePixelRatio);
        const ctx = canvas.getContext('2d');
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg') || '#ffffff';
        ctx.fillRect(0, 0, width, height + headerEl.offsetHeight);
        await html2canvas(headerEl, {canvas, x:0, y:0, width, height:headerEl.offsetHeight, backgroundColor:null});
        await html2canvas(board, {canvas, x:0, y:headerEl.offsetHeight, width, height, backgroundColor:null});
        const url = canvas.toDataURL('image/png');
        const a=document.createElement('a');
        a.href=url;
        a.download=`memorial-capture-${Date.now()}.png`;
        a.click();
      } catch(err){
        console.error('capture failed', err);
        alert('캡처 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
      } finally{
        hideLoading();
      }
    }

    function debounce(fn,ms){
      let t;
      return function(){
        clearTimeout(t);
        t=setTimeout(fn,ms,...arguments);
      };
    }
    function hasText(s){ return typeof s==='string' && s.replace(/\s+/g,'').length>0; }

    let noteSizeCache=null;
    function measureNoteSize(){
      if (noteSizeCache) return noteSizeCache;
      const probe=document.createElement('div');
      probe.className='note';
      probe.style.visibility='hidden';
      probe.style.left='-9999px';
      probe.style.top='-9999px';
      boardWorld.appendChild(probe);
      const rect=probe.getBoundingClientRect();
      noteSizeCache = {w:rect.width / zoomLevel, h:rect.height / zoomLevel};
      probe.remove();
      return noteSizeCache;
    }
    function computeBounds(list){
      if (!Array.isArray(list) || !list.length) return null;
      const {w,h}=measureNoteSize();
      let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
      list.forEach(item=>{
        const x = Math.max(0, Number(item.x)||0);
        const y = Math.max(0, Number(item.y)||0);
        minX = Math.min(minX, x);
        minY = Math.min(minY, y);
        maxX = Math.max(maxX, x + w);
        maxY = Math.max(maxY, y + h);
      });
      return {minX, minY, maxX, maxY};
    }
    function updateBoardMetrics(list){
      const {w,h}=measureNoteSize();
      let maxX = w * 4;
      let maxY = h * 4;
      list.forEach(n=>{
        const x=Math.max(0, n.x||0);
        const y=Math.max(0, n.y||0);
        maxX = Math.max(maxX, x + w + 220);
        maxY = Math.max(maxY, y + h + 260);
      });
      worldWidth = Math.max(maxX, w*4);
      worldHeight = Math.max(maxY, h*4);
    }

    let frontZ = 1000;
    function bringToFront(el){
      frontZ = Math.min(frontZ + 1, 9800);
      el.style.zIndex = String(frontZ);
    }

    function createNoteEl(model){
      if (model.status === 'rejected') return null;
      const el=document.createElement('div');
      el.className='note';
      el.style.left=Math.max(0, model.x||0)+'px';
      el.style.top =Math.max(0, model.y||0)+'px';

      el.dataset.noteId=model.id;
      el.dataset.x=model.x||0;
      el.dataset.y=model.y||0;

      if (!('fs' in model)) model.fs=15;

      const isOwner = model.owner===OWNER_TOKEN;
      const isDraft = isOwner && (!model.status || model.status==='draft');
      const isSubmit= model.status==='submitted';

      if (isDraft){
        el.dataset.draft='1';
        el.classList.add('note--draft');

        el.dataset.draft='0';

      const head=document.createElement('div'); head.className='head';

      if (isDraft){
        const wrap=document.createElement('div'); wrap.className='inline nodrag';
        const nick=document.createElement('input'); nick.className='nick-edit nodrag'; nick.maxLength=12;

        nick.addEventListener('input', debounce(function(){
          model.nick=nick.value.trim()||'익명';
          const i=localDrafts.findIndex(d=>d.id===model.id);
          if (i>=0){
            localDrafts[i]=model;
            saveDrafts(localDrafts);
          }
        },120));
        wrap.appendChild(nick);
        left.appendChild(wrap);
      } else {
        const nameSpan=document.createElement('span'); nameSpan.textContent=(model.nick||'익명');
        left.appendChild(nameSpan);
      }

      const right=document.createElement('div'); right.style.display='flex'; right.style.gap='6px'; right.style.alignItems='center';

        right.appendChild(badge);
      }

      head.appendChild(left);
      head.appendChild(right);
      el.appendChild(head);

      const ta=document.createElement('textarea');
      ta.className='content nodrag';
      ta.placeholder='메시지를 입력하세요...';
      ta.value=model.text||'';
      ta.disabled=!isDraft;
      ta.style.fontSize = (model.fs||15)+'px';
      ta.addEventListener('input', debounce(function(){
        model.text=ta.value;
        if (submitBtn) submitBtn.disabled=!hasText(model.text);
        const i=localDrafts.findIndex(d=>d.id===model.id);
        if (i>=0){
          localDrafts[i]=model;
          saveDrafts(localDrafts);
        }
      },120));
      el.appendChild(ta);

      let submitBtn=null;
      if (isDraft){
        const sliderWrap=document.createElement('div'); sliderWrap.className='draft-slider nodrag';
        const {h:NOTEH}=measureNoteSize();
        const maxFS = Math.max(12, Math.floor(NOTEH * 0.20));
        const range=document.createElement('input');
        range.type='range';
        range.min='12';
        range.max=String(maxFS);
        range.step='1';
        range.value=String(model.fs||15);
        range.className='range nodrag';
        range.title='내용 글자 크기';
        range.addEventListener('input', function(){
          model.fs = clamp(parseInt(range.value,10)||15, 8, 120);
          ta.style.fontSize = model.fs + 'px';
          const i=localDrafts.findIndex(d=>d.id===model.id);

            localDrafts[i]=model;
            saveDrafts(localDrafts);
          }

        sliderWrap.appendChild(range);
        el.appendChild(sliderWrap);

        const actions=document.createElement('div'); actions.className='draft-actions nodrag';
        const delBtn=document.createElement('button'); delBtn.className='mini nodrag'; delBtn.textContent='삭제';

          const needConfirm = hasText(model.text);
          if (needConfirm && !confirm('이 포스트잇을 삭제하시겠습니까?')) return;
          localDrafts = localDrafts.filter(d=>d.id!==model.id);
          saveDrafts(localDrafts);
          renderAll();
          updateDraftButtons();
        });
        submitBtn=document.createElement('button'); submitBtn.className='mini nodrag'; submitBtn.textContent='제출';
        submitBtn.disabled=!hasText(model.text);
        submitBtn.addEventListener('click', function(){
          if (!hasText(model.text)){ alert('내용을 입력해 주세요.'); return; }
          if (!confirm('이 포스트잇을 제출하시겠습니까?\n제출 후에는 수정/삭제가 불가합니다.')) return;
          const payload={
            id:model.id,
            owner:model.owner,
            nick:(model.nick||'').trim()||'익명',
            text:model.text,
            status:'submitted',
            ts:Date.now(),
            tsKR:undefined,
            x:model.x||0,
            y:model.y||0,
            fs:model.fs||15
          };
          submitToServer(payload, function(res){
            if(!res || res.ok!==true){
              const msg = res && res.message ? res.message : '알 수 없는 오류로 제출에 실패했습니다.';
              alert(msg + '\n\n문제가 지속되면 스프레드시트 메뉴의 "버전/상태 보기"에서 로그를 확인하세요.');
              return;
            }
            const saved = res.note;
            localDrafts = localDrafts.filter(d=>d.id!==model.id);
            saveDrafts(localDrafts);
            const idx = serverNotes.findIndex(n=>n.id===saved.id);
            if (idx>=0) serverNotes[idx]=saved; else serverNotes.push(saved);
            const pendingSig = 'pending-' + Date.now().toString(36);
            currentNotesSig = pendingSig;
            persistNotesCache(serverNotes, pendingSig);
            renderAll();
            updateDraftButtons();
            reloadServer({showIndicator:false});
          });
        });
        actions.appendChild(delBtn);
        actions.appendChild(submitBtn);
        el.appendChild(actions);
      }

      el.addEventListener('pointerdown', ()=>bringToFront(el));
      if (isDraft) enableDrag(el, model);

      return el;
    }

    function allNotes(){ return [...serverNotes, ...localDrafts]; }
    function hasOwnDraft(){ return localDrafts.length>0; }
    function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,10); }

    function computeMobileDraftSpot(){
      const {w,h}=measureNoteSize();
      const centerX = (board.scrollLeft + board.clientWidth / 2)/zoomLevel - w/2;
      const topThird = (board.scrollTop/zoomLevel) + (board.clientHeight/zoomLevel)/3 - h/2;
      return {
        x: Math.max(0, Math.round(centerX)),
        y: Math.max(0, Math.round(topThird))
      };
    }
    function addAtBoardXY(x,y, opts={}){
      if (hasOwnDraft()){
        updateDraftButtons();
        alert('이미 작성 중인 포스트잇이 있습니다. 제출 또는 삭제 후 새로 작성해주세요.');
        return;
      }
      const spotX=Math.max(0, Math.round(x));
      const spotY=Math.max(0, Math.round(y));
      const model={ id:uid(), owner:OWNER_TOKEN, x:spotX, y:spotY, text:'', nick:'익명', fs:15 };
      localDrafts.push(model);
      saveDrafts(localDrafts);
      renderAll();
      updateDraftButtons();
      const shouldMobileZoom = opts.forceMobileZoom === true || (opts.forceMobileZoom !== false && isPhoneViewport());
      const shouldZoomToOne = !!opts.zoomTo1 && !shouldMobileZoom;
      focusDraftNote({
        flash:true,
        showAlert:false,
        zoomTo1: shouldZoomToOne,
        forceMobileZoom: shouldMobileZoom,
        presetCenter: opts.presetCenter || null
      });
    }
    function findRandomFreeSpot(){
      const {w,h}=measureNoteSize();
      const viewWidth = board.clientWidth / zoomLevel;
      const viewHeight = board.clientHeight / zoomLevel;
      const sx=board.scrollLeft/zoomLevel;
      const sy=board.scrollTop/zoomLevel;
      const margin=Math.max(18, Math.round(w * 0.12));
      const minX=sx+margin, minY=sy+margin;
      const maxX=sx+Math.max(viewWidth-w-margin*2, margin);
      const maxY=sy+Math.max(viewHeight-h-margin*2, margin);
      for(let t=0;t<40;t++){
        const x=Math.floor(minX+Math.random()*Math.max(maxX-minX, margin));
        const y=Math.floor(minY+Math.random()*Math.max(maxY-minY, margin));
        return {x,y};
      }
      return {x:minX,y:minY};
    }
    function addAtRandom(){
      if (hasOwnDraft()){
        updateDraftButtons();
        alert('작성 중인 포스트잇을 제출/삭제 후 새로 추가할 수 있어요.');
        return;
      }
      if (isPhoneViewport()){
        const spot=computeMobileDraftSpot();
        addAtBoardXY(spot.x, spot.y, {
          zoomTo1:false,
          forceMobileZoom:true,
          presetCenter:{
            x: spot.x + measureNoteSize().w/2,
            y: spot.y + measureNoteSize().h/2
          }
        });
        return;
      }
      const spot=findRandomFreeSpot();
      addAtBoardXY(spot.x,spot.y,{zoomTo1:true});
    }

    function deleteActiveDraft(){
      if (!localDrafts.length) return;
      const hasContent = localDrafts.some(d=>hasText(d.text));
      if (hasContent && !confirm('작성 중인 포스트잇을 삭제하시겠습니까?')) return;
      localDrafts = [];
      saveDrafts(localDrafts);
      renderAll();
      updateDraftButtons();
    }

    function computeMobileZoomFactor(){
      const {w}=measureNoteSize();
      const shortSide = Math.max(1, Math.min(board.clientWidth || w, board.clientHeight || w));
      return clamp((shortSide * 0.8) / Math.max(1, w), MIN_ZOOM, MAX_ZOOM);
    }
    function focusDraftNote(options={}){
      const {
        flash=true,
        showAlert=true,
        maxTries=12,
        zoomTo1=false,
        forceMobileZoom=false,
        presetCenter=null
      } = options;
      let attempts = 0;
      function attempt(){
        const el = boardWorld.querySelector('.note[data-draft="1"]');
        if (!el){
          attempts +=1;
          if (attempts <= maxTries){
            requestAnimationFrame(attempt);
          } else if (showAlert){
            alert('작성 중인 포스트잇이 없습니다.');
          }
          return;
        }
        const {w,h}=measureNoteSize();
        const noteCenter = {
          x: Number(el.dataset.x||0) + w/2,
          y: Number(el.dataset.y||0) + h/2
        };
        const targetCenter = presetCenter ? {
          x: presetCenter.x,
          y: presetCenter.y
        } : noteCenter;
        if (forceMobileZoom && isPhoneViewport()){
          const desired = computeMobileZoomFactor();
          applyZoom(desired, {keepCenter:false});
        } else if (zoomTo1){
          applyZoom(1,{keepCenter:false});
        } else {
          applyZoom(Math.max(zoomLevel, 1.25), {keepCenter:false});
        }
        setBoardCenterWorld(targetCenter.x, targetCenter.y, {behavior:'smooth'});
        bringToFront(el);
        if (flash){
          el.classList.add('note--pulse');
          setTimeout(()=>el.classList.remove('note--pulse'), 1400);
        }
        const ta = el.querySelector('textarea');
        if (ta && !ta.disabled){
          ta.focus({preventScroll:true});
        }
      }
      requestAnimationFrame(attempt);
    }

    function enableDrag(el, model){
      let dragging=false,sx=0,sy=0,dxWorld=0,dyWorld=0,bx=0,by=0;
      const onDown = function(e){
        if (e.target.closest('.nodrag')) return;
        dragging=true;
        el.classList.add('ghost');
        sx=e.clientX;
        sy=e.clientY;
        bx=model.x||0;
        by=model.y||0;
        dxWorld=0;
        dyWorld=0;
        bringToFront(el);
        window.addEventListener('pointermove', onMove, {passive:true});
        window.addEventListener('pointerup', onUp, {once:true});
      };
      const onMove = function(e){
        if (!dragging) return;
        dxWorld=(e.clientX-sx)/zoomLevel;
        dyWorld=(e.clientY-sy)/zoomLevel;
        el.style.transform=`translate3d(${dxWorld}px,${dyWorld}px,0)`;
      };
      const onUp = function(){
        dragging=false;
        el.classList.remove('ghost');
        el.style.transform='';
        model.x=Math.max(0, Math.round(bx+dxWorld));
        model.y=Math.max(0, Math.round(by+dyWorld));
        el.dataset.x = model.x;
        el.dataset.y = model.y;
        el.style.left=model.x+'px';
        el.style.top=model.y+'px';
        const i=localDrafts.findIndex(d=>d.id===model.id);
        if (i>=0){
          localDrafts[i]=model;
          saveDrafts(localDrafts);
        }
        window.removeEventListener('pointermove', onMove);
      };
      el.addEventListener('pointerdown', onDown);
    }

    function updateDraftButtons(){
      const blocked = hasOwnDraft();
      addBtn.disabled = blocked;
      addBtn.title = blocked ? '작성 중인 포스트잇을 제출 또는 삭제하면 새로 생성할 수 있어요.' : '새 포스트잇 만들기';
      deleteDraftBtn.disabled = !blocked;
      jumpDraftBtn.disabled = !blocked;
      if (mobileLayoutActive){
        deleteDraftBtn.classList.remove('is-hidden');
        jumpDraftBtn.classList.remove('is-hidden');
      } else {
        deleteDraftBtn.classList.toggle('is-hidden', !blocked);
        jumpDraftBtn.classList.toggle('is-hidden', !blocked);
      }
      updateFloatingControlsLayout();
    }

    function cancelRenderTask(){
      if (renderTaskId !== null){
        cancelAnimationFrame(renderTaskId);
        renderTaskId = null;
      }
    }
    function renderAll(){
      cancelRenderTask();
      const centerBefore = boardWorld.children.length ? getBoardCenterWorld() : null;
      boardWorld.innerHTML='';
      const list = allNotes().filter(n=> n.status !== 'rejected');
      updateBoardMetrics(list);
      if (!list.length){
        syncBoardScaling({keepCenter:false});
        updateFloatingControlsLayout();
        return;
      }
      const total = list.length;
      const chunkSize = total > 200 ? 48 : total > 120 ? 32 : 20;
      let index = 0;
      function renderChunk(){
        const frag=document.createDocumentFragment();
        let count=0;
        while (index < total && count < chunkSize){
          const el = createNoteEl(list[index]);
          if (el) frag.appendChild(el);
          index += 1;
          count += 1;
        }
        boardWorld.appendChild(frag);
        if (index < total){
          renderTaskId = requestAnimationFrame(renderChunk);
        } else {
          renderTaskId = null;
          syncBoardScaling({keepCenter:false});
          if (centerBefore){
            setBoardCenterWorld(centerBefore.x, centerBefore.y, {behavior:'auto'});
          }
          updateFloatingControlsLayout();
        }
      }
      renderChunk();
    }

    function loadCachedConfig(){
      try{
        const raw = localStorage.getItem(CONFIG_CACHE_KEY);
        return raw ? JSON.parse(raw) : null;
      }catch(_){ return null; }
    }
    function persistCachedConfig(cfg){
      try{
        if (!cfg || !cfg.settingsSignature) return;
        localStorage.setItem(CONFIG_CACHE_KEY, JSON.stringify(cfg));
        localStorage.setItem(SETTINGS_SIG_KEY, cfg.settingsSignature);
      }catch(_){ }
    }

    function applyConfigAndAssets(cfg){
      if (!cfg) return;
      if (cfg.assetsChanged === true) settingsForceRequested = false;

      const prev = (cachedConfig && cachedConfig.settingsSignature) ? cachedConfig : null;
      const merged = {
        pageTitle: cfg.pageTitle || (prev ? prev.pageTitle : ''),
        screenTitle: cfg.screenTitle || (prev ? prev.screenTitle : ''),
        bgColor: cfg.bgColor || (prev ? prev.bgColor : '#0f1115'),
        bgImageDataUrl: cfg.bgImageDataUrl || '',
        postitImageDataUrl: cfg.postitImageDataUrl || '',
        titleAlign: cfg.titleAlign || (prev ? prev.titleAlign : 'left'),
        panelWidthPx: cfg.panelWidthPx || (prev ? prev.panelWidthPx : ''),
        panelDock: cfg.panelDock || (prev ? prev.panelDock : 'left'),
        settingsSignature: cfg.settingsSignature || (prev ? prev.settingsSignature : null),
        assetsChanged: cfg.assetsChanged === true
      };

      if ((!merged.bgImageDataUrl) && prev && prev.settingsSignature === merged.settingsSignature && cfg.assetsChanged === false){
        merged.bgImageDataUrl = prev.bgImageDataUrl || '';
      }
      if ((!merged.postitImageDataUrl) && prev && prev.settingsSignature === merged.settingsSignature && cfg.assetsChanged === false){
        merged.postitImageDataUrl = prev.postitImageDataUrl || '';
      }

      if (merged.pageTitle) document.title = merged.pageTitle;
      if (merged.screenTitle) titleEl.textContent = merged.screenTitle;
      if (merged.bgColor){
        setCSSVar('--bg', merged.bgColor);
        applyTitleContrast(merged.bgColor);
      }
      setCSSVar('--board-image', merged.bgImageDataUrl ? 'url('+merged.bgImageDataUrl+')' : 'none');
      setCSSVar('--postit-image', merged.postitImageDataUrl ? 'url('+merged.postitImageDataUrl+')' : 'none');
      setCSSVar('--title-align', (merged.titleAlign==='center'?'center':'left'));

      panelDockSide = merged.panelDock === 'right' ? 'right' : 'left';
      document.body.classList.toggle('panel-dock-right', panelDockSide === 'right');
      const widthNum = Number(merged.panelWidthPx);
      if (Number.isFinite(widthNum) && widthNum >= 240){
        customPanelWidth = Math.round(widthNum);
        document.documentElement.style.setProperty('--panel-base-width', `${customPanelWidth}px`);
      } else {
        customPanelWidth = 0;
        document.documentElement.style.removeProperty('--panel-base-width');
      }

      currentSettingsSig = merged.settingsSignature || null;
      cachedConfig = {
        pageTitle: merged.pageTitle || '',
        screenTitle: merged.screenTitle || '',
        bgColor: merged.bgColor || '#0f1115',
        bgImageDataUrl: merged.bgImageDataUrl || '',
        postitImageDataUrl: merged.postitImageDataUrl || '',
        titleAlign: merged.titleAlign || 'left',
        panelWidthPx: merged.panelWidthPx || '',
        panelDock: panelDockSide,
        settingsSignature: currentSettingsSig
      };
      if (currentSettingsSig) persistCachedConfig(cachedConfig);

      const missingBg = !merged.bgImageDataUrl;
      const missingPostit = !merged.postitImageDataUrl;
      const hadPrevBg = prev && prev.settingsSignature === merged.settingsSignature && prev.bgImageDataUrl;
      const hadPrevPostit = prev && prev.settingsSignature === merged.settingsSignature && prev.postitImageDataUrl;

      if (!settingsForceRequested &&
          cfg.assetsChanged === false &&
          currentSettingsSig &&
          ((missingBg && !hadPrevBg) || (missingPostit && !hadPrevPostit))){
        settingsForceRequested = true;
        reloadSettingsOnce(true);
      }

      applyBoardTop();
      refreshPanelOverlayState();
      refreshPanelOffset();
      updateFloatingControlsLayout();
    }

    function reloadSettingsOnce(forceFull){
      const sigToSend = forceFull ? null : currentSettingsSig;
      apiConfig(sigToSend)
        .then(cfg => {
          // GAS: cfg = 객체 / REST: cfg = 객체
          applyConfigAndAssets(cfg);
        })
        .catch(e => {
          settingsForceRequested = false;
          console.warn('설정 불러오기 실패:', e && e.message ? e.message : e);
        });
    }
    const settingsTimerState={timer:null, hooked:false};
    function startSettingsAutoRefresh(){
      if (settingsTimerState.timer) clearInterval(settingsTimerState.timer);
      settingsTimerState.timer = setInterval(reloadSettingsOnce, 30000);
      if (!settingsTimerState.hooked){
        document.addEventListener('visibilitychange', ()=>{
          if (!document.hidden) reloadSettingsOnce();
        });
        settingsTimerState.hooked = true;
      }
    }

    function reloadServer(options = {}){
      if (notesInFlight) return;
      const showIndicator = options.showIndicator !== false;
      const forceFull = options.forceFull === true;
      const sigToSend = forceFull ? null : currentNotesSig;

      if (showIndicator) showLoading();
      notesInFlight = true;

      apiListNotes(OWNER_TOKEN, sigToSend)
        .then(res => {
          notesInFlight = false;
          if (showIndicator) hideLoading();

          if (res && typeof res === 'object'){
            if (typeof res.notesSignature === 'string'){
              currentNotesSig = res.notesSignature;
            }
            if (res.notesChanged === true && Array.isArray(res.notes)){
              serverNotes = cloneNotes(res.notes);
              if (currentNotesSig) persistNotesCache(serverNotes, currentNotesSig);
            }
          }
          renderAll();
          updateDraftButtons();
        })
        .catch(err => {
          notesInFlight = false;
          if (showIndicator) hideLoading();
          alert('서버에서 메모를 불러오지 못했습니다. 잠시 후 다시 시도하세요.\n\n' + (err && err.message ? err.message : err));
        });
    }

    // ===== [교체] 제출 에러 힌트 강화 =====
    function submitToServer(model, cb){
      apiSubmit(model)
        .then(res => cb(res))
        .catch(err => {
          const msg = String((err && err.message) || err || '');
          const hint = /Failed to fetch|CORS|TypeError/i.test(msg)
            ? '\n\n[확인 체크]\n' +
              '1) GAS 웹앱 권한 "Anyone" 맞는지\n' +
              '2) Web App URL이 /exec로 되어 있는지\n' +
              '3) 서버가 application/json으로 응답하는지\n'
            : '';
          alert('제출 중 오류가 발생했습니다. 작성한 초안은 로컬에 유지됩니다.\n\n' + msg + hint);
        });
    }

    function handleBootstrapSuccess(payload){
      hideLoading();
      if (!payload || payload.ok === false){
        const msg = payload && payload.message ? payload.message : '초기 데이터를 불러오지 못했습니다.';
        alert(msg + '\n\n페이지를 새로고침하거나 잠시 후 다시 시도해 주세요.');
        return;
      }
      if (payload.config) applyConfigAndAssets(payload.config);
      if (typeof payload.notesSignature === 'string'){
        currentNotesSig = payload.notesSignature;
      }
      if (payload.notesChanged === true && Array.isArray(payload.notes)){
        serverNotes = cloneNotes(payload.notes);
        if (currentNotesSig) persistNotesCache(serverNotes, currentNotesSig);
      } else if (!serverNotes.length && Array.isArray(payload.notes) && payload.notes.length){
        serverNotes = cloneNotes(payload.notes);
      }
      renderAll();
      updateDraftButtons();
      startSettingsAutoRefresh();
    }
    function handleBootstrapError(err){
      hideLoading();
      const msg = String((err && err.message) || err || '');
      const hint = /Failed to fetch|CORS|TypeError/i.test(msg)
        ? '\n\n[확인 체크]\n' +
          '1) GAS 웹앱 배포: Web app → Who has access = "Anyone"\n' +
          '2) 배포 URL이 /exec 로 끝남\n' +
          '3) doGet/doPost가 JSON(ContentService)으로 응답\n'
        : '';
      alert('초기 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.\n\n' + msg + hint);
    }
    function bootstrap(){
      showLoading();
      apiBootstrap(OWNER_TOKEN, currentSettingsSig, currentNotesSig)
        .then(handleBootstrapSuccess)
        .catch(handleBootstrapError);
    }

    function hydrateConfigFromCache(){
      const stored = loadCachedConfig();
      if (stored && stored.settingsSignature){
        cachedConfig = stored;
        currentSettingsSig = stored.settingsSignature;
        applyConfigAndAssets(Object.assign({assetsChanged:false}, stored));
      } else {
        cachedConfig = null;
        currentSettingsSig = localStorage.getItem(SETTINGS_SIG_KEY) || null;
      }
    }
    function hydrateNotesFromCache(){
      const cached = loadServerNotesCache();
      if (cached){
        currentNotesSig = cached.notesSignature || null;
        serverNotes = cloneNotes(cached.notes);
      }
    }

    function applyMobileLayout(){
      if (mobileLayoutActive) return;
      mobileLayoutActive = true;
      document.body.classList.add('is-mobile');
      closeActionSheet({focusRestore:false});
      if (mobileToolsBtn){
        mobileToolsBtn.style.display='inline-flex';
      }
      if (fabContainer && headerActions){
        headerActions.appendChild(fabContainer);
        fabContainer.classList.add('fab-container--mobile');
        [addBtn, deleteDraftBtn, jumpDraftBtn].forEach(btn=>btn.classList.add('fab--mobile'));
      }
      toggleZoomPanel('close');
      refreshPanelOverlayState();
      refreshPanelOffset();
      syncBoardScaling({keepCenter:true});
      updateDraftButtons();
    }
    function applyDesktopLayout(){
      if (!mobileLayoutActive) return;
      mobileLayoutActive = false;
      document.body.classList.remove('is-mobile');
      closeActionSheet({focusRestore:false});
      if (mobileToolsBtn){
        mobileToolsBtn.style.display='none';
        mobileToolsBtn.setAttribute('aria-expanded','false');
      }
      if (fabContainer && fabDesktopParent){
        fabContainer.classList.remove('fab-container--mobile');
        [addBtn, deleteDraftBtn, jumpDraftBtn].forEach(btn=>btn.classList.remove('fab--mobile'));
        if (fabDesktopAnchor){
          fabDesktopParent.insertBefore(fabContainer, fabDesktopAnchor);
        } else {
          fabDesktopParent.appendChild(fabContainer);
        }
      }
      toggleZoomPanel('close');
      refreshPanelOverlayState();
      refreshPanelOffset();
      syncBoardScaling({keepCenter:true});
      updateFloatingControlsLayout();
      updateDraftButtons();
    }
    const mobileMediaQuery = window.matchMedia(`(max-width: ${PHONE_MAX_WIDTH}px)`);
    function handleViewportMode(event){
      const isMatch = event.matches;
      if (isMatch) applyMobileLayout();
      else applyDesktopLayout();
    }
    handleViewportMode(mobileMediaQuery);
    mobileMediaQuery.addEventListener('change', handleViewportMode);

    addBtn.addEventListener('click', addAtRandom);
    deleteDraftBtn.addEventListener('click', deleteActiveDraft);
    jumpDraftBtn.addEventListener('click', ()=>focusDraftNote({flash:true, showAlert:true, zoomTo1:false, forceMobileZoom:mobileLayoutActive}));

    hydrateConfigFromCache();
    hydrateNotesFromCache();
    applyBoardTop();
    refreshPanelOverlayState();
    refreshPanelOffset();
    applyTinyLayoutState(tinyMediaQuery);
    updateFloatingControlsLayout();
    renderAll();
    updateDraftButtons();
    syncBoardScaling({keepCenter:false});
    bootstrap();
  </script>
</body>
</html>
